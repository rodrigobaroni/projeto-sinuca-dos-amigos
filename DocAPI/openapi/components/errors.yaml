      example: Bearer realm="encacapei", error="invalid_token", error_description="The access token expired"
    X-Trace-Id:
      $ref: '../openapi.yaml#/components/headers/TraceId'
  content:
    application/problem+json:
      schema:
        $ref: '#/ProblemDetails'
      examples:
        tokenExpired:
          summary: Access token expirado (renovar e repetir)
          value:
            type: https://api.encacapei.com.br/problems/token-expired
            title: Sessão expirada
            status: 401
            code: TOKEN_EXPIRED
            detail: Seu acesso expirou. Renovando a sessão automaticamente.
            instance: /api/v1/me
            traceId: 0af7651916cd43dd8448eb211c80319c
            timestamp: '2026-07-28T14:05:00Z'
            retryable: true
            errors: []
        invalidCredentials:
          summary: Login inválido (mensagem única, anti-enumeração)
          value:
            type: https://api.encacapei.com.br/problems/invalid-credentials
            title: Credenciais inválidas
            status: 401
            code: INVALID_CREDENTIALS
            detail: E-mail ou senha inválidos.
            instance: /api/v1/auth/login
            traceId: 0af7651916cd43dd8448eb211c80319c
            timestamp: '2026-07-28T14:05:00Z'
            retryable: false
            errors: []
        refreshReuse:
          summary: Reuso de refresh token — família revogada
          value:
            type: https://api.encacapei.com.br/problems/refresh-token-reuse-detected
            title: Acesso suspeito detectado
            status: 401
            code: REFRESH_TOKEN_REUSE_DETECTED
            detail: Detectamos uso indevido da sua sessão. Faça login novamente.
            instance: /api/v1/auth/refresh
            traceId: 0af7651916cd43dd8448eb211c80319c
            timestamp: '2026-07-28T14:05:00Z'
            retryable: false
            errors: []

