# components/errors.yaml
# Problem Details (RFC 9457) — schema, catálogo de códigos e respostas reutilizáveis.

# ============================================================ SCHEMAS

ProblemDetails:
  type: object
  description: |
    Corpo padrão de erro conforme RFC 9457. Servido como `application/problem+json`.

    O cliente **deve** ramificar lógica por `code` (estável), nunca por `title`
    ou `detail` (texto apresentável, sujeito a mudança e tradução).
  required: [type, title, status, code, detail, instance, traceId, timestamp, retryable]
  properties:
    type:
      type: string
      format: uri
      description: URI documentada e estável do tipo de problema.
      example: https://api.encacapei.com.br/problems/league-not-found
    title:
      type: string
      description: Título curto em pt-BR, fixo por `code`.
      example: Liga não encontrada
    status:
      type: integer
      minimum: 400
      maximum: 599
      example: 404
    code:
      $ref: '#/ErrorCode'
    detail:
      type: string
      description: Explicação apresentável ao usuário final; pode variar por instância.
      example: A liga informada não existe ou não está disponível para este usuário.
    instance:
      type: string
      description: Path da requisição que falhou.
      example: /api/v1/leagues/0a1b2c3d-4e5f-4a6b-8c7d-000000000009
    traceId:
      type: string
      pattern: '^[0-9a-f]{32}$'
      description: Trace ID do W3C Trace Context. Exibível na tela de erro para suporte.
      example: 0af7651916cd43dd8448eb211c80319c
    timestamp:
      type: string
      format: date-time
      example: '2026-07-28T14:02:10Z'
    retryable:
      type: boolean
      description: '`true` quando repetir a requisição idêntica pode ter sucesso (429, 503, 409 in-progress).'
      example: false
    errors:
      type: array
      description: Erros por campo. Presente em `422`; acumula **todos** os problemas encontrados.
      items:
        $ref: '#/FieldError'
      default: []
  additionalProperties: true
  examples:
    - type: https://api.encacapei.com.br/problems/league-not-found
      title: Liga não encontrada
      status: 404
      code: LEAGUE_NOT_FOUND
      detail: A liga informada não existe ou não está disponível para este usuário.
      instance: /api/v1/leagues/0a1b2c3d-4e5f-4a6b-8c7d-000000000009
      traceId: 0af7651916cd43dd8448eb211c80319c
      timestamp: '2026-07-28T14:02:10Z'
      retryable: false
      errors: []

FieldError:
  type: object
  required: [field, code, message]
  properties:
    field:
      type: string
      description: Caminho do campo em notação de ponto.
      example: password
    code:
      type: string
      description: Código estável do erro de campo.
      example: PASSWORD_MISSING_UPPERCASE
    message:
      type: string
      description: Mensagem em pt-BR para exibição.
      example: A senha deve conter ao menos uma letra maiúscula.

ValidationProblem:
  allOf:
    - $ref: '#/ProblemDetails'
    - type: object
      properties:
        code:
          const: VALIDATION_ERROR
        errors:
          type: array
          minItems: 1
          items:
            $ref: '#/FieldError'

ConcurrencyProblem:
  allOf:
    - $ref: '#/ProblemDetails'
    - type: object
      description: Conflito de versão. `currentState` evita uma segunda leitura para reconciliar.
      properties:
        code:
          const: CONCURRENT_MODIFICATION
        expectedVersion:
          type: integer
          example: 3
        currentVersion:
          type: integer
          example: 4
        currentState:
          type: object
          additionalProperties: true
          description: Estado atual do recurso, na projeção do endpoint.

ErrorCode:
  type: string
  description: |
    Catálogo fechado de códigos de erro. Um `code` nunca muda de significado
    nem de status HTTP após publicado; novos casos ganham códigos novos.
