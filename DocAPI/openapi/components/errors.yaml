    # --- Autenticação
    - UNAUTHENTICATED
    - TOKEN_EXPIRED
    - TOKEN_INVALID
    - TOKEN_REVOKED
    - INVALID_CREDENTIALS
    - INVALID_CURRENT_PASSWORD
    - INVALID_REFRESH_TOKEN
    - REFRESH_TOKEN_REUSE_DETECTED
    - RESET_TOKEN_INVALID
    - RESET_TOKEN_EXPIRED
    - VERIFICATION_TOKEN_INVALID
    - VERIFICATION_TOKEN_EXPIRED
    - ACCOUNT_DELETED
    - EMAIL_NOT_VERIFIED
    - EMAIL_ALREADY_VERIFIED
    - TOO_MANY_LOGIN_ATTEMPTS
    # --- Autorização
    - FORBIDDEN
    - INSUFFICIENT_LEAGUE_ROLE
    - NOT_LEAGUE_MEMBER
    - NOT_MATCH_PARTICIPANT
    - NOT_SESSION_PARTICIPANT
    - NOT_SHARE_OWNER
    - PROFILE_PRIVATE
    - PROFILE_FRIENDS_ONLY
    - HEAD_TO_HEAD_NOT_ALLOWED
    - USER_BLOCKED
    - CORRECTION_WINDOW_EXPIRED
    - REOPEN_WINDOW_EXPIRED
    - LEAGUE_IS_PRIVATE
    - SHARE_CONSENT_REQUIRED
    # --- Não encontrado
    - USER_NOT_FOUND
    - LEAGUE_NOT_FOUND
    - LEAGUE_MEMBER_NOT_FOUND
    - PLAY_SESSION_NOT_FOUND
    - MATCH_NOT_FOUND
    - MATCH_EVENT_NOT_FOUND
    - VENUE_NOT_FOUND
    - FRIEND_REQUEST_NOT_FOUND
    - FRIENDSHIP_NOT_FOUND
    - INVITATION_NOT_FOUND
    - INVITE_CODE_NOT_FOUND
    - NOTIFICATION_NOT_FOUND
    - SHARE_ARTIFACT_NOT_FOUND
    - SHARE_NOT_FOUND
    - UPLOAD_TOKEN_NOT_FOUND
    - RANKING_REBUILD_NOT_FOUND
    - EXPORT_NOT_FOUND
    # --- Validação
    - VALIDATION_ERROR
    - SEARCH_QUERY_TOO_SHORT
    - INVALID_SORT_FIELD
    - INVALID_FILTER_VALUE
    - CONFLICTING_FILTERS
    - AMBIGUOUS_SELECTION
    - INVALID_METRIC
    - INVALID_GRANULARITY_FOR_PERIOD
    - INVALID_COORDINATES
    - RADIUS_OUT_OF_RANGE
    - LOCATION_OR_QUERY_REQUIRED
    - INVALID_IMAGE
    - INVALID_PUSH_TOKEN
    - CANNOT_DISABLE_SYSTEM_CATEGORY
    - INVALID_QUIET_HOURS
    - CANNOT_FRIEND_SELF
    - CANNOT_COMPARE_WITH_SELF
    - CANNOT_BLOCK_SELF
    - TOO_MANY_INVITES
    - TOO_MANY_PARTICIPANTS
    - TOO_MANY_IDS
    - IDEMPOTENCY_KEY_REUSE
    - INVALID_IDEMPOTENCY_KEY
    - INVALID_ROLE
    - CORRECTION_NO_CHANGE
    - CANCEL_NOTE_REQUIRED
    - EXPIRES_IN_OUT_OF_RANGE
    - BUSINESS_DATE_OUT_OF_RANGE
    # --- Conflito
    - CONCURRENT_MODIFICATION
    - ALREADY_FRIENDS
    - FRIEND_REQUEST_ALREADY_PENDING
    - FRIEND_REQUEST_NOT_PENDING
    - ALREADY_BLOCKED
    - ALREADY_MEMBER
    - INVITATION_NOT_PENDING
    - LEAGUE_FINISHED
    - LEAGUE_ALREADY_FINISHED
    - LEAGUE_HAS_ACTIVE_SESSION
    - LEAGUE_HAS_HISTORY
    - LEAGUE_RULES_LOCKED
    - OWNER_MUST_TRANSFER
    - CANNOT_REMOVE_OWNER
    - CANNOT_DEMOTE_SELF_AS_OWNER
    - MEMBER_NOT_ACTIVE
    - MEMBER_HAS_ACTIVE_MATCH
    - OWNER_OF_ACTIVE_LEAGUES
    - NOT_ENOUGH_MEMBERS
    - SESSION_ALREADY_EXISTS
    - SESSION_ALREADY_OPEN
    - SESSION_CLOSED
    - SESSION_ALREADY_CLOSED
    - SESSION_NOT_CLOSED
    - SESSION_HAS_ACTIVE_MATCHES
    - SESSION_HAS_NO_MATCHES
    - ANOTHER_SESSION_OPEN
    - PLAYER_ALREADY_IN_MATCH
    - MATCH_NOT_IN_PROGRESS
    - MATCH_ALREADY_FINISHED
    - MATCH_ALREADY_CANCELLED
    - MATCH_CANCELLED
    - MATCH_NOT_FINISHED
    - BALL_ALREADY_POCKETED
    - EVENT_ALREADY_UNDONE
    - EVENT_TYPE_DISABLED
    - EXPORT_ALREADY_IN_PROGRESS
