    # --- Expirado
    - INVITATION_EXPIRED
    - INVITE_CODE_EXPIRED
    - INVITE_CODE_REVOKED
    - INVITE_CODE_EXHAUSTED
    - SHARE_EXPIRED
    - SHARE_REVOKED
    - EXPORT_EXPIRED
    # --- Protocolo
    - MALFORMED_REQUEST
    - IDEMPOTENCY_KEY_REQUIRED
    - MISSING_REQUIRED_HEADER
    - METHOD_NOT_ALLOWED
    - PAYLOAD_TOO_LARGE
    - FILE_TOO_LARGE
    - UNSUPPORTED_MEDIA_TYPE
    - PRECONDITION_REQUIRED
    # --- Limites e indisponibilidade
    - RATE_LIMIT_EXCEEDED
    - QUOTA_EXCEEDED
    - INTERNAL_ERROR
    - SERVICE_UNAVAILABLE
    - MAINTENANCE_MODE
    - DEPENDENCY_UNAVAILABLE

# ============================================================ RESPONSES

BadRequest:
  description: Requisição malformada ou header obrigatório ausente.
  headers:
    X-Trace-Id:
      $ref: '../openapi.yaml#/components/headers/TraceId'
  content:
    application/problem+json:
      schema:
        $ref: '#/ProblemDetails'
      examples:
        idempotencyKeyRequired:
          summary: Idempotency-Key ausente
          value:
            type: https://api.encacapei.com.br/problems/idempotency-key-required
            title: Cabeçalho Idempotency-Key obrigatório
            status: 400
            code: IDEMPOTENCY_KEY_REQUIRED
            detail: Esta operação exige o cabeçalho Idempotency-Key com um UUID.
            instance: /api/v1/matches
            traceId: 0af7651916cd43dd8448eb211c80319c
            timestamp: '2026-07-28T14:02:10Z'
            retryable: false
            errors: []
        malformed:
          summary: JSON inválido
          value:
            type: https://api.encacapei.com.br/problems/malformed-request
            title: Requisição inválida
            status: 400
            code: MALFORMED_REQUEST
            detail: O corpo da requisição não é um JSON válido.
            instance: /api/v1/leagues
            traceId: 0af7651916cd43dd8448eb211c80319c
            timestamp: '2026-07-28T14:02:10Z'
            retryable: false
            errors: []

