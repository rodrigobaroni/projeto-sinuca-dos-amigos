# paths/friendships.yaml — amigos, convites de amizade e confronto direto

MeFriends:
  get:
    operationId: listFriends
    summary: Listar amigos
    description: Aba "Seus amigos". O parâmetro `q` alimenta o campo "Buscar amigos...".
    tags: [Friendships]
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/SearchQuery'
      - $ref: '../openapi.yaml#/components/parameters/Page'
      - $ref: '../openapi.yaml#/components/parameters/PageSize'
      - name: sort
        in: query
        schema:
          type: string
          enum: [displayName, -displayName, createdAt, -createdAt]
          default: displayName
      - name: include
        in: query
        schema:
          type: string
        example: headToHead
    responses:
      '200':
        description: Lista de amigos.
        headers:
          ETag:
            $ref: '../openapi.yaml#/components/headers/ETag'
        content:
          application/json:
            schema:
              type: object
              required: [items, meta]
              properties:
                items:
                  type: array
                  items:
                    $ref: '../components/schemas.yaml#/Friend'
                meta:
                  $ref: '../components/schemas.yaml#/PaginationMetaOffset'
            example:
              items:
                - id: 44444444-4444-4444-8444-444444444444
                  username: ander
                  displayName: Anderson Lima
                  avatarUrl: null
                  initials: AN
                  avatarColor: '#e9c46a'
                  friendshipId: 6d5c4b3a-2918-4706-85f4-000000000003
                  friendsSince: '2025-06-11T20:05:00Z'
                  mutualLeaguesCount: 1
                  lastPlayedAt: '2026-07-15T00:45:31Z'
                - id: 33333333-3333-4333-8333-333333333333
                  username: felipao
                  displayName: Felipe Costa
                  avatarUrl: https://cdn.encacapei.com.br/avatars/33333333-3333-4333-8333-333333333333/256.webp
                  initials: FE
                  avatarColor: '#f4a261'
                  friendshipId: 6d5c4b3a-2918-4706-85f4-000000000002
                  friendsSince: '2025-02-19T21:40:00Z'
                  mutualLeaguesCount: 2
                  lastPlayedAt: '2026-07-15T00:33:56Z'
                - id: 22222222-2222-4222-8222-222222222222
                  username: joaop
                  displayName: João Pereira
                  avatarUrl: https://cdn.encacapei.com.br/avatars/22222222-2222-4222-8222-222222222222/256.webp
                  initials: JO
                  avatarColor: '#8ecae6'
                  friendshipId: 6d5c4b3a-2918-4706-85f4-000000000001
                  friendsSince: '2025-04-02T19:22:00Z'
                  mutualLeaguesCount: 2
                  lastPlayedAt: '2026-07-15T01:08:22Z'
                - id: 55555555-5555-4555-8555-555555555555
                  username: marcao
                  displayName: Marcos Silva
                  avatarUrl: null
                  initials: MA
                  avatarColor: '#c8b6ff'
                  friendshipId: 6d5c4b3a-2918-4706-85f4-000000000004
                  friendsSince: '2025-09-30T22:15:00Z'
