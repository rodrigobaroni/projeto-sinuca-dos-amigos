HeadToHeadLeagues:
  get:
    operationId: getHeadToHeadLeagues
    summary: Ligas em comum com um adversário
    description: Popula o select de liga do head-to-head.
    tags: [Friendships]
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/UserIdPath'
    responses:
      '200':
        description: Ligas em comum.
        content:
          application/json:
            schema:
              type: object
              required: [items, meta]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        $ref: '../components/schemas.yaml#/Uuid'
                      name:
                        type: string
                      status:
                        $ref: '../components/schemas.yaml#/LeagueStatus'
                      matchesTogether:
                        type: integer
                meta:
                  type: object
                  properties:
                    totalItems:
                      type: integer
            example:
              items:
                - { id: 0a1b2c3d-4e5f-4a6b-8c7d-000000000001, name: Liga da Terça, status: ACTIVE, matchesTogether: 6 }
                - { id: 0a1b2c3d-4e5f-4a6b-8c7d-000000000002, name: Ranking do Bar do Zé, status: ACTIVE, matchesTogether: 2 }
              meta: { totalItems: 2 }
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '404':
        $ref: '../openapi.yaml#/components/responses/NotFound'
