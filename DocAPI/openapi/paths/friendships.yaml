MeFriendById:
  delete:
    operationId: removeFriend
    summary: Remover amizade
    description: |
      Unilateral e silencioso. **Não** remove de ligas, **não** apaga histórico de
      partidas e **não** notifica (RN-FRIEND-009). O head-to-head continua acessível
      se houver liga em comum.
    tags: [Friendships]
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/UserIdPath'
    responses:
      '204':
        description: Amizade removida.
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '404':
        $ref: '../openapi.yaml#/components/responses/NotFound'

MeFriendRequests:
  get:
    operationId: listFriendRequests
    summary: Listar convites de amizade
    description: |
      `meta.totalItems` é a fonte do **badge vermelho** na aba "Convites" — não é
      preciso um endpoint de contagem separado.
    tags: [Friendships]
    parameters:
      - name: direction
        in: query
        schema:
          $ref: '../components/schemas.yaml#/RequestDirection'
      - name: status
        in: query
        description: Lista separada por vírgula.
        schema:
          type: string
          default: PENDING
        example: PENDING
      - $ref: '../openapi.yaml#/components/parameters/Limit'
      - $ref: '../openapi.yaml#/components/parameters/Cursor'
    responses:
      '200':
        description: Convites de amizade.
        content:
          application/json:
            schema:
              type: object
              required: [items, meta]
              properties:
                items:
                  type: array
                  items:
                    $ref: '../components/schemas.yaml#/FriendRequest'
                meta:
                  $ref: '../components/schemas.yaml#/PaginationMetaCursor'
            example:
              items:
                - id: 9f8e7d6c-5b4a-4392-8180-000000000001
                  direction: INCOMING
                  status: PENDING
                  user:
                    id: 66666666-6666-4666-8666-666666666666
                    username: carlosmota
                    displayName: Carlos Mota
                    avatarUrl: null
                    initials: CA
                    avatarColor: '#c8b6ff'
                  message: null
                  mutualFriendsCount: 2
                  createdAt: '2026-07-27T13:30:00Z'
                  expiresAt: null
                - id: 9f8e7d6c-5b4a-4392-8180-000000000002
                  direction: INCOMING
                  status: PENDING
                  user:
                    id: 77777777-7777-4777-8777-777777777777
                    username: pedronunes
                    displayName: Pedro Nunes
                    avatarUrl: null
                    initials: PE
                    avatarColor: '#8ecae6'
                  message: null
                  mutualFriendsCount: 1
                  createdAt: '2026-07-26T22:14:00Z'
                  expiresAt: null
              meta: { totalItems: 2, pageSize: 20, hasMore: false, nextCursor: null }
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '422':
        $ref: '../openapi.yaml#/components/responses/UnprocessableEntity'

FriendRequests:
  post:
    operationId: sendFriendRequest
    summary: Enviar convite de amizade
    description: |
      Se já existir convite pendente **no sentido inverso**, a amizade é criada
      automaticamente e a resposta é `200` com `autoAccepted: true` (RN-FRIEND-004).
    tags: [Friendships]
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/CreateFriendRequest'
          examples:
            byId:
              summary: Por ID
              value:
                userId: 66666666-6666-4666-8666-666666666666
            byUsername:
              summary: Por username
              value:
                username: carlosmota
    responses:
      '201':
        description: Convite criado.
        headers:
          Location:
            $ref: '../openapi.yaml#/components/headers/Location'
          Idempotent-Replay:
            $ref: '../openapi.yaml#/components/headers/IdempotentReplay'
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/FriendRequest'
            example:
              id: 9f8e7d6c-5b4a-4392-8180-000000000010
              direction: OUTGOING
              status: PENDING
              user:
                id: 66666666-6666-4666-8666-666666666666
                username: carlosmota
                displayName: Carlos Mota
                avatarUrl: null
                initials: CA
                avatarColor: '#c8b6ff'
              createdAt: '2026-07-27T19:00:00Z'
              expiresAt: null
      '200':
        description: Amizade criada automaticamente (havia convite recíproco pendente).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/FriendRequest'
            example:
              id: 9f8e7d6c-5b4a-4392-8180-000000000001
              direction: INCOMING
              status: ACCEPTED
              autoAccepted: true
              user:
                id: 66666666-6666-4666-8666-666666666666
                username: carlosmota
                displayName: Carlos Mota
                initials: CA
                avatarColor: '#c8b6ff'
              createdAt: '2026-07-27T13:30:00Z'
              friendship:
                id: 6d5c4b3a-2918-4706-85f4-000000000005
                createdAt: '2026-07-27T19:00:00Z'
      '400':
        $ref: '../openapi.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../openapi.yaml#/components/responses/Forbidden'
      '404':
        $ref: '../openapi.yaml#/components/responses/NotFound'
      '409':
        $ref: '../openapi.yaml#/components/responses/Conflict'
      '422':
        $ref: '../openapi.yaml#/components/responses/UnprocessableEntity'
      '429':
        $ref: '../openapi.yaml#/components/responses/TooManyRequests'

FriendRequestById:
  delete:
    operationId: cancelFriendRequest
    summary: Cancelar convite enviado
    description: |
      Somente o **remetente**. O destinatário deve usar `decline` — para ele este
      endpoint retorna `404`. Apaga a notificação pendente do destinatário.
    tags: [Friendships]
    parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 9f8e7d6c-5b4a-4392-8180-000000000010
    responses:
      '204':
        description: Convite cancelado.
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '404':
        $ref: '../openapi.yaml#/components/responses/NotFound'
      '409':
        $ref: '../openapi.yaml#/components/responses/Conflict'

FriendRequestAccept:
  post:
    operationId: acceptFriendRequest
    summary: Aceitar convite de amizade
    description: Somente o **destinatário**. Cria a amizade e notifica o remetente.
    tags: [Friendships]
    parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 9f8e7d6c-5b4a-4392-8180-000000000001
    responses:
      '200':
        description: Convite aceito; amizade criada.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/FriendRequestResponse'
            example:
              requestId: 9f8e7d6c-5b4a-4392-8180-000000000001
              status: ACCEPTED
              respondedAt: '2026-07-27T19:05:00Z'
              friendship:
                id: 6d5c4b3a-2918-4706-85f4-000000000005
                createdAt: '2026-07-27T19:05:00Z'
                friend:
                  id: 66666666-6666-4666-8666-666666666666
                  username: carlosmota
                  displayName: Carlos Mota
                  avatarUrl: null
                  initials: CA
                  avatarColor: '#c8b6ff'
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '404':
        $ref: '../openapi.yaml#/components/responses/NotFound'
      '409':
        $ref: '../openapi.yaml#/components/responses/Conflict'

FriendRequestDecline:
  post:
    operationId: declineFriendRequest
    summary: Recusar convite de amizade
    description: '**Não notifica** o remetente (RN-FRIEND-007 — proteção social).'
    tags: [Friendships]
    parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 9f8e7d6c-5b4a-4392-8180-000000000002
    responses:
      '200':
        description: Convite recusado.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/FriendRequestResponse'
            example:
              requestId: 9f8e7d6c-5b4a-4392-8180-000000000002
              status: DECLINED
              respondedAt: '2026-07-27T19:06:00Z'
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '404':
        $ref: '../openapi.yaml#/components/responses/NotFound'
      '409':
        $ref: '../openapi.yaml#/components/responses/Conflict'

HeadToHead:
  get:
    operationId: getHeadToHead
    summary: Confronto direto com um adversário
    description: |
      Placar agregado e taxa de aproveitamento. Permitido a amigos **ou** a quem
      tem ao menos uma partida/liga em comum.

      `byLeague` popula o filtro de liga da tela, evitando um segundo request.
      O filtro de **período nunca é materializado** — é sempre agregado sob demanda.
    tags: [Friendships]
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/UserIdPath'
      - name: leagueId
        in: query
        schema:
          type: string
          format: uuid
      - $ref: '../openapi.yaml#/components/parameters/PeriodFilter'
      - $ref: '../openapi.yaml#/components/parameters/FromFilter'
      - $ref: '../openapi.yaml#/components/parameters/ToFilter'
    responses:
      '200':
        description: Agregado do confronto.
        headers:
          Cache-Control:
            schema:
              type: string
            example: private, max-age=60
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/HeadToHead'
            example:
              opponent:
                id: 22222222-2222-4222-8222-222222222222
                username: joaop
                displayName: João Pereira
                avatarUrl: https://cdn.encacapei.com.br/avatars/22222222-2222-4222-8222-222222222222/256.webp
                initials: JO
                avatarColor: '#8ecae6'
              filters: { leagueId: null, period: ALL_TIME, from: null, to: null }
              summary:
                myWins: 5
                opponentWins: 3
                totalMatches: 8
                myWinRate: 62.50
                opponentWinRate: 37.50
                sessionsPlayed: 4
                currentStreak: { holder: ME, count: 1 }
                longestStreak: { holder: ME, count: 2 }
                lastMatch:
                  id: 3f4a5b6c-7d8e-4f90-8a1b-000000000009
                  winnerUserId: 11111111-1111-4111-8111-111111111111
                  finishedAt: '2026-07-15T01:08:22Z'
                  leagueId: 0a1b2c3d-4e5f-4a6b-8c7d-000000000001
                  leagueName: Liga da Terça
                firstMatchAt: '2025-04-15T23:40:00Z'
              byLeague:
                - { leagueId: 0a1b2c3d-4e5f-4a6b-8c7d-000000000001, leagueName: Liga da Terça, myWins: 3, opponentWins: 3, totalMatches: 6 }
                - { leagueId: 0a1b2c3d-4e5f-4a6b-8c7d-000000000002, leagueName: Ranking do Bar do Zé, myWins: 2, opponentWins: 0, totalMatches: 2 }
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../openapi.yaml#/components/responses/Forbidden'
      '404':
        $ref: '../openapi.yaml#/components/responses/NotFound'
      '422':
        $ref: '../openapi.yaml#/components/responses/UnprocessableEntity'

HeadToHeadSessions:
  get:
    operationId: getHeadToHeadSessions
    summary: Confronto direto agrupado por jogatina
    description: |
      A lista "Dias de jogatina" agrega por **dia**, não por partida. `outcome`
      é derivado no servidor e define a cor do badge.
    tags: [Friendships]
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/UserIdPath'
      - name: leagueId
        in: query
        schema:
          type: string
          format: uuid
      - $ref: '../openapi.yaml#/components/parameters/PeriodFilter'
      - $ref: '../openapi.yaml#/components/parameters/FromFilter'
      - $ref: '../openapi.yaml#/components/parameters/ToFilter'
      - $ref: '../openapi.yaml#/components/parameters/Limit'
      - $ref: '../openapi.yaml#/components/parameters/Cursor'
    responses:
      '200':
        description: Jogatinas em que os dois se enfrentaram.
        content:
          application/json:
            schema:
              type: object
              required: [items, meta]
              properties:
                items:
                  type: array
                  items:
                    $ref: '../components/schemas.yaml#/HeadToHeadSession'
                meta:
