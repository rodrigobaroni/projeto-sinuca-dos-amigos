# paths/users.yaml — perfil, avatar, busca, estatísticas e ciclo de vida da conta

UsernameAvailable:
  get:
    operationId: checkUsernameAvailability
    summary: Verificar disponibilidade de username
    description: |
      Usado na etapa 2 do cadastro e na edição de perfil. Revela existência de
      **username** (público por design na UI), nunca de e-mail. Rate limit de 20/min.
    tags: [Users]
    security: []
    parameters:
      - name: username
        in: query
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 20
          pattern: '^[a-z0-9_.]+$'
        example: baroni
    responses:
      '200':
        description: Resultado da verificação.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/UsernameAvailability'
            examples:
              taken:
                value:
                  username: baroni
                  available: false
                  reason: TAKEN
                  suggestions: [baroni1, baroni_sinuca, rbaroni]
              available:
                value:
                  username: baroni_sinuca
                  available: true
                  reason: null
                  suggestions: []
      '422':
        $ref: '../openapi.yaml#/components/responses/UnprocessableEntity'
      '429':
        $ref: '../openapi.yaml#/components/responses/TooManyRequests'

SearchUsers:
  get:
    operationId: searchUsers
    summary: Buscar usuários
    description: |
      Busca por `username` e `displayName` (trigram, acentos normalizados).
      **Nunca** retorna e-mail nem permite busca por e-mail (RN-PRIV-007).
      Respeita `searchableByUsername`.

      `relationship.status` decide o botão do card: `Adicionar` / `Pendente` /
      `Aceitar` / `Amigos`.
    tags: [Users]
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/SearchQuery'
      - $ref: '../openapi.yaml#/components/parameters/Limit'
      - $ref: '../openapi.yaml#/components/parameters/Cursor'
      - name: excludeFriends
        in: query
        schema:
          type: boolean
          default: false
      - name: leagueId
        in: query
        description: Restringe a membros da liga (usado na seleção de adversário).
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Resultados da busca.
        content:
          application/json:
            schema:
              type: object
              required: [items, meta]
              properties:
                items:
                  type: array
                  items:
                    $ref: '../components/schemas.yaml#/UserSearchResult'
                meta:
                  $ref: '../components/schemas.yaml#/PaginationMetaCursor'
            example:
              items:
                - id: 66666666-6666-4666-8666-666666666666
                  username: carlosmota
                  displayName: Carlos Mota
                  avatarUrl: null
                  initials: CA
                  avatarColor: '#c8b6ff'
                  relationship:
                    status: REQUEST_RECEIVED
                    friendRequestId: 9f8e7d6c-5b4a-4392-8180-000000000001
                    canSendRequest: false
                  mutualLeaguesCount: 0
                  mutualFriendsCount: 2
              meta: { totalItems: 1, pageSize: 20, hasMore: false, nextCursor: null }
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '422':
        $ref: '../openapi.yaml#/components/responses/UnprocessableEntity'
      '429':
        $ref: '../openapi.yaml#/components/responses/TooManyRequests'

GetUser:
  get:
    operationId: getUser
    summary: Consultar perfil público de outro usuário
    tags: [Users]
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/UserIdPath'
    responses:
      '200':
        description: Perfil público.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/PublicUser'
            example:
              id: 22222222-2222-4222-8222-222222222222
              username: joaop
              displayName: João Pereira
              avatarUrl: https://cdn.encacapei.com.br/avatars/22222222-2222-4222-8222-222222222222/256.webp
              initials: JO
              avatarColor: '#8ecae6'
              memberSince: '2025-03-08'
              relationship:
                status: FRIENDS
                friendsSince: '2025-04-02T19:22:00Z'
              sharedLeagues:
                - { id: 0a1b2c3d-4e5f-4a6b-8c7d-000000000001, name: Liga da Terça }
                - { id: 0a1b2c3d-4e5f-4a6b-8c7d-000000000002, name: Ranking do Bar do Zé }
              statisticsVisible: true
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '404':
        $ref: '../openapi.yaml#/components/responses/NotFound'

GetUserStatistics:
  get:
    operationId: getUserStatistics
    summary: Consultar estatísticas de outro usuário
    description: |
      Respeita `profileVisibility`. **Exceção:** dentro de uma liga em comum,
      V/D/% daquela liga são sempre visíveis — é o próprio ranking (RN-USER-008).
    tags: [Users]
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/UserIdPath'
      - $ref: '../openapi.yaml#/components/parameters/PeriodFilter'
      - name: leagueId
        in: query
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Estatísticas do usuário.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/UserStatistics'
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../openapi.yaml#/components/responses/Forbidden'
      '404':
        $ref: '../openapi.yaml#/components/responses/NotFound'

Me:
  get:
    operationId: getMe
    summary: Consultar perfil autenticado
    description: |
      Com `include=statistics,counters`, entrega em **uma chamada** tudo que a Home
      precisa: perfil, os 4 KPIs e os badges de notificação e convites.
    tags: [Users]
    parameters:
      - name: include
        in: query
        description: Projeções adicionais, separadas por vírgula.
        schema:
          type: string
        example: statistics,counters
      - $ref: '../openapi.yaml#/components/parameters/IfNoneMatch'
    responses:
      '200':
        description: Perfil do usuário autenticado.
        headers:
          ETag:
            $ref: '../openapi.yaml#/components/headers/ETag'
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/MeProfile'
            example:
              id: 11111111-1111-4111-8111-111111111111
              username: baroni
              displayName: Rodrigo Baroni
              email: rodrigo.baroni@email.com
              avatarUrl: null
              initials: RB
              avatarColor: '#C1E778'
              status: ACTIVE
              emailVerified: true
              memberSince: '2025-01-14'
              timezone: America/Sao_Paulo
              locale: pt-BR
              profileVisibility: FRIENDS_ONLY
              searchableByUsername: true
              shareStatsPublicly: false
              locationConsentGrantedAt: '2026-03-02T14:20:00Z'
              createdAt: '2025-01-14T22:10:00Z'
              updatedAt: '2026-07-20T11:05:33Z'
              version: 3
              statistics:
                matchesPlayed: 47
                wins: 29
                losses: 18
                winRate: 61.70
                currentWinStreak: 5
                longestWinStreak: 7
                currentLossStreak: 0
                longestLossStreak: 2
                sessionsPlayed: 14
                podiumFirsts: 6
                lastMatchAt: '2026-07-15T01:08:22Z'
              counters:
                unreadNotifications: 3
                pendingFriendRequests: 2
                pendingLeagueInvitations: 1
                activeLeagues: 2
                activeMatchId: null
      '304':
        $ref: '../openapi.yaml#/components/responses/NotModified'
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'

  patch:
    operationId: updateMe
    summary: Editar perfil
    description: |
      Atualização parcial com optimistic locking. Campos `id`, `email`, `status`,
      `createdAt` e `version` são **ignorados** se enviados (proteção contra mass
      assignment). Trocar de e-mail é fluxo próprio, pós-MVP.
    tags: [Users]
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/IfMatch'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/UpdateMeRequest'
          examples:
            update:
              value:
                displayName: Rodrigo Baroni
                username: baroni
                profileVisibility: FRIENDS_ONLY
    responses:
      '200':
        description: Perfil atualizado.
        headers:
          ETag:
            $ref: '../openapi.yaml#/components/headers/ETag'
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/MeProfile'
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '409':
        $ref: '../openapi.yaml#/components/responses/Conflict'
      '422':
        $ref: '../openapi.yaml#/components/responses/UnprocessableEntity'
      '428':
        $ref: '../openapi.yaml#/components/responses/PreconditionRequired'

  delete:
    operationId: deleteMe
    summary: Excluir conta (LGPD)
    description: |
      Agenda **anonimização em 30 dias**. Login dentro do prazo cancela a exclusão.
      O histórico de partidas é preservado de forma anonimizada, para não destruir o
      ranking dos demais jogadores (RN-USER-007).
    tags: [Users]
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/IfMatch'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/DeleteAccountRequest'
          examples:
            delete:
              value:
                password: Sinuca@2026
                confirmation: EXCLUIR MINHA CONTA
                reason: Não jogo mais sinuca
    responses:
      '202':
        description: Exclusão agendada.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/DeleteAccountResponse'
            example:
              status: DELETION_SCHEDULED
              scheduledFor: '2026-08-26T18:52:00Z'
              cancelBy: '2026-08-26T18:52:00Z'
              message: Sua conta será anonimizada em 30 dias. Faça login antes disso para cancelar.
              dataRetentionNotice: Seu histórico de partidas será mantido de forma anonimizada para preservar o ranking dos demais jogadores.
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '409':
        $ref: '../openapi.yaml#/components/responses/Conflict'
      '422':
        $ref: '../openapi.yaml#/components/responses/UnprocessableEntity'
      '428':
        $ref: '../openapi.yaml#/components/responses/PreconditionRequired'

MeAvatarUploadUrl:
  post:
    operationId: requestAvatarUploadUrl
    summary: Obter URL assinada para upload de avatar
    description: |
      Devolve um SAS de escrita com TTL de 10 minutos. O app faz `PUT` **direto no
      Blob** — não passa 5 MB pelo backend em 4G de bar — e depois confirma com
      `PUT /me/avatar`.
    tags: [Users]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/AvatarUploadUrlRequest'
          examples:
            jpeg:
              value:
                contentType: image/jpeg
                contentLength: 842113
    responses:
      '200':
        description: URL de upload emitida.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/AvatarUploadUrl'
            example:
              uploadUrl: https://stlftmencacapeiprd.blob.core.windows.net/avatars-staging/11111111-1111-4111-8111-111111111111/6f2a9c1b.jpg?sv=2024-11-04&se=2026-07-27T18%3A45%3A00Z&sp=cw&sig=REDACTED
              uploadToken: upl_6f2a9c1b8d3e4f5a9b0c1d2e3f4a5b6c
              method: PUT
              requiredHeaders:
                x-ms-blob-type: BlockBlob
                Content-Type: image/jpeg
              expiresAt: '2026-07-27T18:45:00Z'
              maxBytes: 5242880
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '413':
        $ref: '../openapi.yaml#/components/responses/PayloadTooLarge'
      '415':
        $ref: '../openapi.yaml#/components/responses/UnsupportedMediaType'
      '429':
        $ref: '../openapi.yaml#/components/responses/TooManyRequests'

MeAvatar:
  put:
    operationId: confirmAvatar
    summary: Confirmar upload de avatar
    description: |
      Valida **magic bytes** (não a extensão), remove todo EXIF — inclusive GPS
      (RN-PRIV-002) —, gera derivadas 256×256 e 64×64 em WebP e publica no CDN.
    tags: [Users]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/ConfirmAvatarRequest'
          examples:
            confirm:
              value:
                uploadToken: upl_6f2a9c1b8d3e4f5a9b0c1d2e3f4a5b6c
    responses:
      '200':
        description: Avatar publicado.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Avatar'
            example:
              avatarUrl: https://cdn.encacapei.com.br/avatars/11111111-1111-4111-8111-111111111111/256.webp
              thumbnailUrl: https://cdn.encacapei.com.br/avatars/11111111-1111-4111-8111-111111111111/64.webp
              updatedAt: '2026-07-27T18:44:12Z'
              version: 5
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '404':
        $ref: '../openapi.yaml#/components/responses/NotFound'
      '422':
        $ref: '../openapi.yaml#/components/responses/UnprocessableEntity'

  delete:
    operationId: deleteAvatar
    summary: Remover avatar
    description: Volta a exibir as iniciais sobre `avatarColor`.
    tags: [Users]
    responses:
      '204':
        description: Avatar removido.
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'

MeStatistics:
  get:
    operationId: getMyStatistics
    summary: Estatísticas do usuário autenticado (KPIs da Home)
    description: |
      Mapeamento direto para os 4 cartões da Home:
      `matchesPlayed` → "Partidas jogadas" · `winRate` → "Taxa de vitória"
      · `currentWinStreak` → "Vitórias consecutivas" · `longestLossStreak` →
      "Maiores derrotas" (DP-016b).
    tags: [Users]
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/PeriodFilter'
      - name: leagueId
        in: query
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Estatísticas agregadas.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/UserStatistics'
            example:
              period: ALL_TIME
              leagueId: null
              matchesPlayed: 47
              wins: 29
              losses: 18
              winRate: 61.70
              currentWinStreak: 5
              longestWinStreak: 7
              currentLossStreak: 0
              longestLossStreak: 2
              sessionsPlayed: 14
              podiumFirsts: 6
              podiums: { first: 6, second: 4, third: 2 }
              ballsPocketedTotal: 213
              averageMatchDurationSeconds: 1284
              firstMatchAt: '2025-01-21T23:14:00Z'
              lastMatchAt: '2026-07-15T01:08:22Z'
              computedAt: '2026-07-27T18:30:05Z'
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '404':
        $ref: '../openapi.yaml#/components/responses/NotFound'

MeStatisticsTimeSeries:
  get:
    operationId: getMyStatisticsTimeSeries
    summary: Séries temporais (gráficos de evolução da Home)
    description: |
      Dois gráficos do expander "Gráficos de evolução":

      - `metric=WIN_RATE&period=LAST_30_DAYS&granularity=DAY` — taxa de vitória
        **acumulada** (a curva suave do mockup; taxa diária seria um serrote — DP-031).
      - `metric=WINS_LOSSES&period=LAST_4_WEEKS&granularity=WEEK` — barras pareadas
        com `label` "Sem 1".."Sem 4" gerado pelo servidor.

      Agrupamento sempre no fuso do **usuário**. Semanas ISO-8601 (segunda a domingo).
    tags: [Users]
    parameters:
      - name: metric
        in: query
        required: true
        schema:
          $ref: '../components/schemas.yaml#/StatisticMetric'
      - $ref: '../openapi.yaml#/components/parameters/PeriodFilter'
      - name: granularity
        in: query
        schema:
          $ref: '../components/schemas.yaml#/Granularity'
      - name: leagueId
        in: query
        schema:
          type: string
          format: uuid
      - name: fillGaps
        in: query
        description: Preenche dias sem jogo, para a linha não ter buracos.
        schema:
          type: boolean
          default: true
    responses:
      '200':
        description: Série temporal.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/TimeSeries'
            examples:
              winRate30d:
                summary: Taxa de vitória — últimos 30 dias
                value:
                  metric: WIN_RATE
                  period: LAST_30_DAYS
                  granularity: DAY
                  timezone: America/Sao_Paulo
                  from: '2026-06-28'
                  to: '2026-07-27'
                  unit: PERCENT
                  points:
                    - { bucket: '2026-06-30', date: '2026-06-30', value: 50.00, matchesPlayed: 3 }
                    - { bucket: '2026-07-07', date: '2026-07-07', value: 55.56, matchesPlayed: 5 }
                    - { bucket: '2026-07-14', date: '2026-07-14', value: 61.70, matchesPlayed: 4 }
                  summary: { first: 50.00, last: 61.70, change: 11.70, trend: UP }
              winsLosses4w:
                summary: Vitórias e derrotas por semana
                value:
                  metric: WINS_LOSSES
                  period: LAST_4_WEEKS
                  granularity: WEEK
                  timezone: America/Sao_Paulo
                  from: '2026-06-29'
                  to: '2026-07-26'
                  unit: COUNT
                  points:
                    - { bucket: '2026-W27', weekStart: '2026-06-29', weekEnd: '2026-07-05', label: Sem 1, wins: 5, losses: 3 }
                    - { bucket: '2026-W28', weekStart: '2026-07-06', weekEnd: '2026-07-12', label: Sem 2, wins: 4, losses: 4 }
                    - { bucket: '2026-W29', weekStart: '2026-07-13', weekEnd: '2026-07-19', label: Sem 3, wins: 6, losses: 2 }
                    - { bucket: '2026-W30', weekStart: '2026-07-20', weekEnd: '2026-07-26', label: Sem 4, wins: 5, losses: 2 }
                  summary: { totalWins: 20, totalLosses: 11, winRate: 64.52 }
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '422':
        $ref: '../openapi.yaml#/components/responses/UnprocessableEntity'

MeActiveMatch:
  get:
    operationId: getMyActiveMatch
    summary: Partida em andamento do usuário
    description: |
      Permite retomar a partida após fechar o app no meio dela (RN-MATCH-020).
      Devolve `204` quando não há nenhuma.
    tags: [Users, Matches]
    responses:
      '200':
        description: Partida em andamento.
        headers:
          ETag:
            $ref: '../openapi.yaml#/components/headers/ETag'
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Match'
      '204':
        description: Nenhuma partida em andamento.
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'

MeDeactivate:
  post:
    operationId: deactivateAccount
    summary: Desativar conta
    description: |
      Esconde o perfil das buscas, revoga sessões e cancela convites enviados.
      **Mantém** ligas e histórico. Qualquer login reativa a conta.
    tags: [Users]
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/IfMatch'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/DeactivateAccountRequest'
          examples:
            deactivate:
              value:
                password: Sinuca@2026
                reason: Preciso de uma pausa
    responses:
      '200':
        description: Conta desativada.
        content:
          application/json:
            schema:
              type: object
              required: [status, deactivatedAt]
              properties:
                status:
                  type: string
                  const: DEACTIVATED
                deactivatedAt:
                  type: string
                  format: date-time
                reactivationHint:
                  type: string
            example:
              status: DEACTIVATED
              deactivatedAt: '2026-07-27T18:50:00Z'
              reactivationHint: Faça login novamente a qualquer momento para reativar sua conta.
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '409':
        $ref: '../openapi.yaml#/components/responses/Conflict'
      '428':
        $ref: '../openapi.yaml#/components/responses/PreconditionRequired'

MeDataExports:
  post:
    operationId: requestDataExport
    summary: Solicitar exportação de dados (LGPD)
    description: |
      Gera ZIP com JSON + CSV. Dados de **terceiros são pseudonimizados**
      ("Jogador A") para não entregar dado pessoal de outro titular. Link com TTL de 72 h.
    tags: [Users]
    responses:
      '202':
        description: Exportação agendada.
        headers:
          Location:
            $ref: '../openapi.yaml#/components/headers/Location'
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/DataExport'
            example:
              id: e1f2a3b4-c5d6-4e7f-8a9b-000000000001
              status: PENDING
              requestedAt: '2026-07-27T18:55:00Z'
              estimatedReadyAt: '2026-07-27T19:05:00Z'
              statusUrl: /api/v1/me/data-exports/e1f2a3b4-c5d6-4e7f-8a9b-000000000001
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '409':
        $ref: '../openapi.yaml#/components/responses/Conflict'
      '429':
        $ref: '../openapi.yaml#/components/responses/TooManyRequests'

MeDataExportById:
  get:
    operationId: getDataExport
    summary: Consultar status da exportação
    tags: [Users]
    parameters:
      - name: exportId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: e1f2a3b4-c5d6-4e7f-8a9b-000000000001
    responses:
      '200':
        description: Status da exportação.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/DataExport'
            example:
              id: e1f2a3b4-c5d6-4e7f-8a9b-000000000001
              status: READY
              fileUrl: https://stlftmencacapeiprd.blob.core.windows.net/exports/e1f2a3b4.zip?se=2026-07-30T19%3A05%3A00Z&sig=REDACTED
              fileSizeBytes: 184320
              format: ZIP
              contents: [profile.json, matches.csv, leagues.json, friendships.json, statistics.json, notifications.json, audit.json, README.txt]
              requestedAt: '2026-07-27T18:55:00Z'
              completedAt: '2026-07-27T19:01:12Z'
              expiresAt: '2026-07-30T19:01:12Z'
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '404':
        $ref: '../openapi.yaml#/components/responses/NotFound'
      '410':
        $ref: '../openapi.yaml#/components/responses/Gone'
