LeagueMemberById:
  patch:
    operationId: changeMemberRole
    summary: Alterar papel de membro
    description: |
      Exclusivo do `OWNER`. Promover alguém a `OWNER` **rebaixa o dono atual a
      `ADMIN`** numa transação atômica — a liga sempre tem exatamente um dono,
      garantido por unique constraint parcial no banco.
    tags: [LeagueMembers]
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/LeagueIdPath'
      - $ref: '../openapi.yaml#/components/parameters/UserIdPath'
      - $ref: '../openapi.yaml#/components/parameters/IfMatchOptional'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/ChangeMemberRoleRequest'
          examples:
            promote:
              summary: Promover a admin
              value:
                role: ADMIN
            transfer:
              summary: Transferir propriedade
              value:
                role: OWNER
    responses:
      '200':
        description: Papel alterado.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ChangeMemberRoleResponse'
            examples:
              promoted:
                value:
                  userId: 33333333-3333-4333-8333-333333333333
                  displayName: Felipe Costa
                  role: ADMIN
                  previousRole: PLAYER
                  status: ACTIVE
                  changedAt: '2026-07-27T19:25:00Z'
                  version: 2
              transferred:
                value:
                  userId: 33333333-3333-4333-8333-333333333333
                  displayName: Felipe Costa
                  role: OWNER
                  previousRole: ADMIN
                  status: ACTIVE
                  changedAt: '2026-07-27T19:26:00Z'
                  ownershipTransferred: true
                  previousOwner: { userId: 11111111-1111-4111-8111-111111111111, newRole: ADMIN }
                  version: 3
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../openapi.yaml#/components/responses/Forbidden'
      '404':
        $ref: '../openapi.yaml#/components/responses/NotFound'
      '409':
        $ref: '../openapi.yaml#/components/responses/Conflict'
      '422':
        $ref: '../openapi.yaml#/components/responses/UnprocessableEntity'

  delete:
    operationId: removeLeagueMember
    summary: Remover membro da liga
    description: |
      `ADMIN` pode remover apenas `PLAYER`; `OWNER` pode remover qualquer um
      (RN-MEMBER-005). Mantém histórico e a entrada de ranking marcada como inativa.
    tags: [LeagueMembers]
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/LeagueIdPath'
      - $ref: '../openapi.yaml#/components/parameters/UserIdPath'
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              reason:
                type: string
                maxLength: 300
    responses:
      '204':
        description: Membro removido.
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../openapi.yaml#/components/responses/Forbidden'
      '404':
        $ref: '../openapi.yaml#/components/responses/NotFound'
      '409':
        $ref: '../openapi.yaml#/components/responses/Conflict'

LeagueRanking:
  get:
    operationId: getLeagueRanking
    summary: Ranking da liga
    description: |
      Tabela `# | Jogador | V | D | %`. Ordenação é **regra de negócio**
      (RN-RANKING-002), não preferência do cliente — este endpoint **não** aceita `sort`.

      `winRate` vem com 2 casas exatas; o arredondamento para inteiro é do cliente
      (half-up). `positionChange` compara com o ranking anterior.
    tags: [Rankings, Leagues]
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/LeagueIdPath'
      - $ref: '../openapi.yaml#/components/parameters/PeriodFilter'
      - name: playSessionId
