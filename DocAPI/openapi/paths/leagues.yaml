LeagueMatches:
  get:
    operationId: listLeagueMatches
    summary: Histórico de partidas da liga
    description: |
      Aba Histórico. `playSessionId` implementa o filtro "Todos os dias / 7 de julho
      / 30 de junho"; `result` implementa "Todos / Vitórias / Derrotas" — sempre
      **relativo ao usuário autenticado**.
    tags: [Matches, Leagues]
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/LeagueIdPath'
      - name: playSessionId
        in: query
        schema:
          type: string
          format: uuid
      - name: businessDate
        in: query
        schema:
          type: string
          format: date
      - name: result
        in: query
        schema:
          $ref: '../components/schemas.yaml#/MatchResultForMe'
      - name: status
        in: query
        schema:
          type: string
          default: FINISHED
      - name: userId
        in: query
        schema:
          type: string
          format: uuid
      - name: opponentId
        in: query
        schema:
          type: string
          format: uuid
      - $ref: '../openapi.yaml#/components/parameters/FromFilter'
      - $ref: '../openapi.yaml#/components/parameters/ToFilter'
      - $ref: '../openapi.yaml#/components/parameters/Limit'
      - $ref: '../openapi.yaml#/components/parameters/Cursor'
      - name: sort
        in: query
        schema:
          type: string
          enum: [finishedAt, -finishedAt, startedAt, -startedAt]
          default: -finishedAt
    responses:
      '200':
        description: Partidas da liga.
        content:
          application/json:
            schema:
