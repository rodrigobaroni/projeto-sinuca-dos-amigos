      '404':
        $ref: '../openapi.yaml#/components/responses/NotFound'
      '409':
        $ref: '../openapi.yaml#/components/responses/Conflict'

MatchFinish:
  post:
    operationId: finishMatch
    summary: Finalizar partida
    description: |
      Botões "Venceu" / "Perdeu" da tela de partida. O contrato é por **lado**
      (`winnerSide`), não por "eu venci": o app traduz. Isso sobrevive a duplas e ao
      registro por um terceiro (RN-MATCH-009).

      **Transação síncrona:** status, `isWinner`, ranking da liga, ranking da
      jogatina, contadores e liberação de `activeMatchId`. **Assíncrono:**
      estatísticas do usuário, h2h e notificação ao adversário.

      A resposta entrega **tudo que o modal de vitória precisa** — pódio completo,
      posição e ranking — evitando 3 requisições na pior rede do fluxo.
    tags: [Matches]
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/MatchIdPath'
      - $ref: '../openapi.yaml#/components/parameters/IdempotencyKey'
      - $ref: '../openapi.yaml#/components/parameters/IfMatch'
      - $ref: '../openapi.yaml#/components/parameters/CorrelationId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/FinishMatchRequest'
          examples:
            bySide:
              summary: Por lado (canônico)
              value:
                winnerSide: 1
            byUser:
              summary: Por usuário (conveniência em 1v1)
              value:
                winnerUserId: 11111111-1111-4111-8111-111111111111
    responses:
      '200':
        description: Partida finalizada; rankings atualizados.
        headers:
          ETag:
            $ref: '../openapi.yaml#/components/headers/ETag'
          Idempotent-Replay:
            $ref: '../openapi.yaml#/components/headers/IdempotentReplay'
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/FinishMatchResponse'
            example:
              match:
                id: 3f4a5b6c-7d8e-4f90-8a1b-000000000009
                status: FINISHED
                resultStatus: ORIGINAL
                winnerSide: 1
                startedAt: '2026-07-15T00:47:00Z'
                finishedAt: '2026-07-15T01:08:22Z'
                durationSeconds: 1282
                finishedBy: { id: 11111111-1111-4111-8111-111111111111, username: baroni, displayName: Rodrigo Baroni, initials: RB, avatarColor: '#C1E778' }
                participants:
                  - { userId: 11111111-1111-4111-8111-111111111111, displayName: Rodrigo Baroni, side: 1, isWinner: true, ballsPocketed: 1, fouls: 0 }
                  - { userId: 22222222-2222-4222-8222-222222222222, displayName: João Pereira, side: 2, isWinner: false, ballsPocketed: 1, fouls: 0 }
                myResult: WIN
                correctionDeadline: '2026-07-16T01:08:22Z'
                version: 6
              leagueRanking:
                updated: true
                myEntry: { position: 2, previousPosition: 4, wins: 7, losses: 4, winRate: 63.64 }
                opponentEntries:
                  - { userId: 22222222-2222-4222-8222-222222222222, position: 3, previousPosition: 3, wins: 5, losses: 4, winRate: 55.56 }
              sessionRanking:
                isFinal: false
                myPosition: 1
                podium:
                  - { position: 1, medal: GOLD, userId: 11111111-1111-4111-8111-111111111111, displayName: Rodrigo Baroni, wins: 4, losses: 0 }
                  - { position: 2, medal: SILVER, userId: 33333333-3333-4333-8333-333333333333, displayName: Felipe Costa, wins: 3, losses: 1 }
                  - { position: 3, medal: BRONZE, userId: 22222222-2222-4222-8222-222222222222, displayName: João Pereira, wins: 2, losses: 2 }
                  - { position: 4, medal: null, userId: 44444444-4444-4444-8444-444444444444, displayName: Anderson Lima, wins: 0, losses: 6 }
              streak: { currentWinStreak: 5, longestWinStreak: 7, isPersonalBest: false }
      '400':
