MatchEvents:
  get:
    operationId: listMatchEvents
    summary: Listar eventos da partida
    tags: [Matches]
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/MatchIdPath'
      - name: includeUndone
        in: query
        schema:
          type: boolean
          default: true
      - $ref: '../openapi.yaml#/components/parameters/Limit'
    responses:
      '200':
        description: Eventos ordenados por `sequence`.
        content:
          application/json:
            schema:
              type: object
              required: [items, meta]
              properties:
                items:
                  type: array
                  items:
                    $ref: '../components/schemas.yaml#/MatchEvent'
                meta:
                  $ref: '../components/schemas.yaml#/PaginationMetaCursor'
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../openapi.yaml#/components/responses/Forbidden'
      '404':
        $ref: '../openapi.yaml#/components/responses/NotFound'

  post:
    operationId: recordMatchEvent
    summary: Registrar evento (bola encaçapada ou falta)
    description: |
      Toque numa bola da grade. **Endpoint mais sujeito a duplo toque** do produto:
      com chaves de idempotência diferentes, a segunda requisição cai em
      `409 BALL_ALREADY_POCKETED` (protegido por unique constraint parcial); com a
      mesma chave, é replay silencioso.

      `If-Match` é **opcional aqui, propositalmente**: exigir a versão exata numa
      tela em que dois celulares marcam bolas alternadamente geraria conflitos
      constantes sem ganho — o unique de bola já garante a invariante real. Em
      **finalização** e **correção**, `If-Match` é obrigatório.

      `suggestion` é dica de UX: quando a bola 8 cai, o app pode sugerir encerrar —
      mas o servidor **nunca** finaliza a partida sozinho (RN-EVENT-008).
    tags: [Matches]
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/MatchIdPath'
      - $ref: '../openapi.yaml#/components/parameters/IdempotencyKey'
      - $ref: '../openapi.yaml#/components/parameters/IfMatchOptional'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/CreateMatchEventRequest'
          examples:
            ball:
              summary: Bola encaçapada
              value:
                type: BALL_POCKETED
                ballNumber: 8
                actorUserId: 11111111-1111-4111-8111-111111111111
            foul:
              summary: Falta (requer trackFouls)
              value:
                type: FOUL
                actorUserId: 22222222-2222-4222-8222-222222222222
    responses:
      '201':
        description: Evento registrado.
        headers:
          ETag:
            $ref: '../openapi.yaml#/components/headers/ETag'
          Idempotent-Replay:
            $ref: '../openapi.yaml#/components/headers/IdempotentReplay'
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/MatchEventResponse'
            example:
              event:
                id: ae1b2c3d-4e5f-4a60-8b71-000000000003
                matchId: 3f4a5b6c-7d8e-4f90-8a1b-000000000009
                sequence: 3
                type: BALL_POCKETED
                ballNumber: 8
                actorUserId: 11111111-1111-4111-8111-111111111111
                actorDisplayName: Rodrigo Baroni
                side: 1
