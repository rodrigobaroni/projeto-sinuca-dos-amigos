MatchEventById:
  delete:
    operationId: undoMatchEvent
    summary: Desfazer evento
    description: |
      Toque numa bola **já** encaçapada (toggle). É **soft undo** (`undoneAt`), nunca
      `DELETE` físico — preserva a trilha "encaçapou e desfez", que é justamente o
      que resolve discussão de mesa. Um evento desfeito nunca volta a `RECORDED`:
      tocar de novo cria um evento **novo** com nova `sequence`.
    tags: [Matches]
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/MatchIdPath'
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: ae1b2c3d-4e5f-4a60-8b71-000000000003
    responses:
      '200':
        description: Evento desfeito; estado da mesa recalculado.
        content:
          application/json:
            schema:
              type: object
              required: [event, tableState, matchVersion]
              properties:
                event:
                  $ref: '../components/schemas.yaml#/MatchEvent'
                tableState:
                  $ref: '../components/schemas.yaml#/TableState'
                participants:
                  type: array
                  items:
                    type: object
                    properties:
                      userId:
                        $ref: '../components/schemas.yaml#/Uuid'
                      ballsPocketed:
                        type: integer
                      fouls:
                        type: integer
                matchVersion:
                  type: integer
            example:
              event:
                id: ae1b2c3d-4e5f-4a60-8b71-000000000003
                type: BALL_POCKETED
                ballNumber: 8
                sequence: 3
                occurredAt: '2026-07-15T01:07:55Z'
                undoneAt: '2026-07-15T01:08:05Z'
                undoneByUserId: 11111111-1111-4111-8111-111111111111
                recordedByUserId: 11111111-1111-4111-8111-111111111111
              tableState:
                ballsCount: 8
                pocketedBalls:
                  - { ballNumber: 2, eventId: ae1b2c3d-4e5f-4a60-8b71-000000000001, pocketedByUserId: 11111111-1111-4111-8111-111111111111, occurredAt: '2026-07-15T00:49:12Z' }
                  - { ballNumber: 4, eventId: ae1b2c3d-4e5f-4a60-8b71-000000000002, pocketedByUserId: 22222222-2222-4222-8222-222222222222, occurredAt: '2026-07-15T00:52:40Z' }
                remainingBalls: [1, 3, 5, 6, 7, 8]
              participants:
                - { userId: 11111111-1111-4111-8111-111111111111, ballsPocketed: 1, fouls: 0 }
                - { userId: 22222222-2222-4222-8222-222222222222, ballsPocketed: 1, fouls: 0 }
              matchVersion: 5
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
