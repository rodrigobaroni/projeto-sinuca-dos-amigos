MatchCancel:
  post:
    operationId: cancelMatch
    summary: Cancelar partida
    description: |
      Partida cancelada **não conta** em ranking, estatística, h2h nem pódio
      (RN-MATCH-013). Os eventos de bola são **preservados**. Partida já finalizada
      só muda por correção — ou por cancelamento de admin dentro de 24 h.
    tags: [Matches]
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/MatchIdPath'
      - $ref: '../openapi.yaml#/components/parameters/IdempotencyKey'
      - $ref: '../openapi.yaml#/components/parameters/IfMatch'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/CancelMatchRequest'
          examples:
            mistake:
              value:
                reason: MISTAKE
                note: Partida aberta por engano com o adversário errado
            abandoned:
              value:
                reason: ABANDONED
    responses:
      '200':
        description: Partida cancelada.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/CancelMatchResponse'
            example:
              id: 3f4a5b6c-7d8e-4f90-8a1b-000000000009
              status: CANCELLED
              cancelReason: MISTAKE
              note: Partida aberta por engano com o adversário errado
              cancelledAt: '2026-07-15T00:48:10Z'
              cancelledBy: { id: 11111111-1111-4111-8111-111111111111, username: baroni, displayName: Rodrigo Baroni, initials: RB, avatarColor: '#C1E778' }
              rankingImpact: NONE
              version: 3
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../openapi.yaml#/components/responses/Forbidden'
      '404':
        $ref: '../openapi.yaml#/components/responses/NotFound'
      '409':
        $ref: '../openapi.yaml#/components/responses/Conflict'
      '422':
        $ref: '../openapi.yaml#/components/responses/UnprocessableEntity'
      '428':
        $ref: '../openapi.yaml#/components/responses/PreconditionRequired'

MatchCorrections:
  get:
    operationId: listMatchCorrections
    summary: Histórico de correções da partida
    description: |
      É a trilha exigida por RN-AUDIT-004, exibida no app:
      "Resultado corrigido por Rodrigo em 14/07 às 22:22 — motivo: …".
    tags: [Matches]
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/MatchIdPath'
    responses:
      '200':
        description: Correções aplicadas, em ordem cronológica.
        content:
          application/json:
            schema:
              type: object
              required: [items, meta]
              properties:
                items:
                  type: array
                  items:
                    $ref: '../components/schemas.yaml#/MatchCorrection'
                meta:
                  type: object
                  properties:
                    totalItems:
                      type: integer
            example:
              items:
                - id: d5e6f708-192a-4b3c-8d4e-000000000001
                  matchId: 3f4a5b6c-7d8e-4f90-8a1b-000000000009
                  previousResult: { winnerSide: 1, winnerUserIds: [11111111-1111-4111-8111-111111111111] }
                  newResult: { winnerSide: 2, winnerUserIds: [22222222-2222-4222-8222-222222222222] }
                  reason: 'Marcamos errado: quem venceu foi o João, a bola 8 caiu na caçapa errada.'
                  correctedBy: { id: 11111111-1111-4111-8111-111111111111, username: baroni, displayName: Rodrigo Baroni, initials: RB, avatarColor: '#C1E778' }
                  createdAt: '2026-07-15T01:22:40Z'
              meta: { totalItems: 1 }
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../openapi.yaml#/components/responses/Forbidden'
      '404':
        $ref: '../openapi.yaml#/components/responses/NotFound'

  post:
    operationId: correctMatchResult
    summary: Corrigir resultado da partida
    description: |
      Permitido a **participantes dentro de 24 h** de `finishedAt`; depois disso,
      apenas `ADMIN`/`OWNER` da liga (`DP-003`).

      `reason` é **obrigatório** — é o registro que encerra a discussão. O resultado
      anterior nunca é sobrescrito sem trilha: cria-se um `MatchCorrection`, o
      `resultStatus` vira `CORRECTED` e **todos** os participantes são notificados.

      O ranking é **reconstruído de forma determinística** a partir de `matches`,
      não por delta — aplicar delta produziria deriva silenciosa e quebraria streaks.
      Ligas com até 500 partidas são reprocessadas de forma síncrona (`200`); acima
      disso, assíncrona (`202` + `statusUrl`).
    tags: [Matches, Rankings]
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/MatchIdPath'
      - $ref: '../openapi.yaml#/components/parameters/IdempotencyKey'
      - $ref: '../openapi.yaml#/components/parameters/IfMatch'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/CreateCorrectionRequest'
          examples:
            correction:
              value:
                winnerSide: 2
                reason: 'Marcamos errado: quem venceu foi o João, a bola 8 caiu na caçapa errada.'
    responses:
      '202':
        description: Correção aplicada; reprocessamento de ranking enfileirado.
        headers:
          Location:
            $ref: '../openapi.yaml#/components/headers/Location'
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/CorrectionResponse'
            example:
              correction:
                id: d5e6f708-192a-4b3c-8d4e-000000000001
                matchId: 3f4a5b6c-7d8e-4f90-8a1b-000000000009
                previousResult: { winnerSide: 1, winnerUserIds: [11111111-1111-4111-8111-111111111111] }
                newResult: { winnerSide: 2, winnerUserIds: [22222222-2222-4222-8222-222222222222] }
                reason: 'Marcamos errado: quem venceu foi o João, a bola 8 caiu na caçapa errada.'
                correctedBy: { id: 11111111-1111-4111-8111-111111111111, username: baroni, displayName: Rodrigo Baroni, initials: RB, avatarColor: '#C1E778' }
                createdAt: '2026-07-15T01:22:40Z'
              match:
                id: 3f4a5b6c-7d8e-4f90-8a1b-000000000009
                status: FINISHED
                resultStatus: CORRECTED
                winnerSide: 2
                correctionCount: 1
                version: 7
              rankingRebuild:
                jobId: f6a7b8c9-0d1e-4f2a-8b3c-000000000001
                status: QUEUED
                scope: [LEAGUE_RANKING, SESSION_RANKING, USER_STATISTICS, HEAD_TO_HEAD]
                statusUrl: /api/v1/ranking-rebuilds/f6a7b8c9-0d1e-4f2a-8b3c-000000000001
                estimatedCompletionSeconds: 3
      '200':
        description: Correção aplicada e ranking já reprocessado (liga pequena).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/CorrectionResponse'
      '400':
        $ref: '../openapi.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../openapi.yaml#/components/responses/Forbidden'
      '404':
        $ref: '../openapi.yaml#/components/responses/NotFound'
      '409':
        $ref: '../openapi.yaml#/components/responses/Conflict'
      '422':
        $ref: '../openapi.yaml#/components/responses/UnprocessableEntity'
      '428':
        $ref: '../openapi.yaml#/components/responses/PreconditionRequired'
      '429':
        $ref: '../openapi.yaml#/components/responses/TooManyRequests'

