# paths/matches.yaml — jogatinas, partidas, eventos de bola, finalização e correção

# ==================================================== PLAY SESSIONS

PlaySessions:
  post:
    operationId: createPlaySession
    summary: Criar jogatina explicitamente
    description: |
      Alternativa à abertura implícita (`GET /leagues/{id}/play-sessions/current?createIfMissing=true`).
      Permite registrar uma noite passada dentro de ±7 dias.

      Existe no máximo **uma** jogatina aberta por liga e **uma** por
      (liga, `businessDate`) — garantido por unique constraints parciais.
    tags: [PlaySessions]
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/CreatePlaySessionRequest'
          examples:
            today:
              summary: Jogatina de hoje
              value:
                leagueId: 0a1b2c3d-4e5f-4a6b-8c7d-000000000001
            withParticipants:
              summary: Com quem já apareceu
              value:
                leagueId: 0a1b2c3d-4e5f-4a6b-8c7d-000000000001
                businessDate: '2026-07-14'
                venueId: 5e6f7a8b-9c0d-4e1f-8a2b-000000000001
                participantUserIds:
                  - 11111111-1111-4111-8111-111111111111
                  - 22222222-2222-4222-8222-222222222222
                  - 33333333-3333-4333-8333-333333333333
                  - 44444444-4444-4444-8444-444444444444
    responses:
      '201':
        description: Jogatina criada.
        headers:
          Location:
            $ref: '../openapi.yaml#/components/headers/Location'
          ETag:
            $ref: '../openapi.yaml#/components/headers/ETag'
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/PlaySession'
      '400':
        $ref: '../openapi.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../openapi.yaml#/components/responses/Forbidden'
      '404':
        $ref: '../openapi.yaml#/components/responses/NotFound'
      '409':
        $ref: '../openapi.yaml#/components/responses/Conflict'
      '422':
        $ref: '../openapi.yaml#/components/responses/UnprocessableEntity'

PlaySessionById:
  get:
    operationId: getPlaySession
    summary: Consultar jogatina
    tags: [PlaySessions]
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/PlaySessionIdPath'
      - name: include
        in: query
        schema:
          type: string
        example: ranking,participants,matches
      - $ref: '../openapi.yaml#/components/parameters/IfNoneMatch'
    responses:
      '200':
        description: Jogatina.
        headers:
          ETag:
            $ref: '../openapi.yaml#/components/headers/ETag'
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/PlaySession'
      '304':
        $ref: '../openapi.yaml#/components/responses/NotModified'
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../openapi.yaml#/components/responses/Forbidden'
      '404':
        $ref: '../openapi.yaml#/components/responses/NotFound'

PlaySessionRanking:
  get:
    operationId: getPlaySessionRanking
    summary: Ranking / pódio da jogatina
    description: |
      Alimenta o "N vitórias hoje" da seleção de adversário e o card do modal de
      pódio.

      Ordena por **vitórias** (é o que o card mostra), não por percentual — numa
      única noite, quem venceu mais é o campeão do dia. Empate em 1º gera
      **medalhas compartilhadas** (`DP-027`): dois `GOLD` e nenhum `SILVER`.

      `isFinal = false` enquanto a jogatina está aberta — a UI deve dizer
      "está em 1º", não "ficou em 1º".
    tags: [PlaySessions, Rankings]
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/PlaySessionIdPath'
    responses:
      '200':
        description: Pódio da jogatina.
        headers:
          Cache-Control:
            schema:
              type: string
            example: private, max-age=10, must-revalidate
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/SessionRanking'
            example:
              playSessionId: 7c8d9e0f-1a2b-4c3d-8e4f-000000000001
              businessDate: '2026-07-14'
              label: Jogatina de 14 jul
              league: { id: 0a1b2c3d-4e5f-4a6b-8c7d-000000000001, name: Liga da Terça }
              status: IN_PROGRESS
              isFinal: false
              items:
                - position: 1
                  medal: GOLD
                  user: { id: 11111111-1111-4111-8111-111111111111, username: baroni, displayName: Rodrigo Baroni, initials: RB, avatarColor: '#C1E778' }
                  wins: 4
                  losses: 0
                  matchesPlayed: 4
                  isMe: true
                - position: 2
                  medal: SILVER
                  user: { id: 33333333-3333-4333-8333-333333333333, username: felipao, displayName: Felipe Costa, initials: FE, avatarColor: '#f4a261' }
                  wins: 3
                  losses: 1
                  matchesPlayed: 4
                  isMe: false
                - position: 3
                  medal: BRONZE
                  user: { id: 22222222-2222-4222-8222-222222222222, username: joaop, displayName: João Pereira, initials: JO, avatarColor: '#8ecae6' }
                  wins: 2
                  losses: 2
                  matchesPlayed: 4
                  isMe: false
                - position: 4
                  medal: null
                  user: { id: 44444444-4444-4444-8444-444444444444, username: ander, displayName: Anderson Lima, initials: AN, avatarColor: '#e9c46a' }
                  wins: 0
                  losses: 6
                  matchesPlayed: 6
                  isMe: false
              meta: { totalItems: 4, updatedAt: '2026-07-15T01:08:23Z' }
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../openapi.yaml#/components/responses/Forbidden'
      '404':
        $ref: '../openapi.yaml#/components/responses/NotFound'

PlaySessionParticipants:
  post:
    operationId: addPlaySessionParticipants
    summary: Adicionar participantes à jogatina
    description: |
      Registra quem apareceu mas ainda não jogou. É assim que "Anderson — 0 vitórias"
      aparece no pódio (RN-SESSION-007).
    tags: [PlaySessions]
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/PlaySessionIdPath'
      - $ref: '../openapi.yaml#/components/parameters/IdempotencyKeyOptional'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/AddParticipantsRequest'
          examples:
            add:
              value:
                userIds: [55555555-5555-4555-8555-555555555555]
    responses:
      '200':
        description: Participantes adicionados.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/AddParticipantsResponse'
            example:
              playSessionId: 7c8d9e0f-1a2b-4c3d-8e4f-000000000001
              added:
                - { userId: 55555555-5555-4555-8555-555555555555, displayName: Marcos Silva, joinedAt: '2026-07-15T00:50:00Z' }
              alreadyPresent: [44444444-4444-4444-8444-444444444444]
              participantsCount: 5
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../openapi.yaml#/components/responses/Forbidden'
      '404':
        $ref: '../openapi.yaml#/components/responses/NotFound'
      '409':
        $ref: '../openapi.yaml#/components/responses/Conflict'
      '422':
        $ref: '../openapi.yaml#/components/responses/UnprocessableEntity'

PlaySessionClose:
  post:
    operationId: closePlaySession
    summary: Encerrar jogatina
    description: |
      Congela o pódio (`isFinal: true`), notifica os participantes e recalcula
      `nextSessionAt` da liga. Exige que **nenhuma partida** esteja em andamento —
      ou use `force: true` para cancelá-las em cascata.
    tags: [PlaySessions]
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/PlaySessionIdPath'
      - $ref: '../openapi.yaml#/components/parameters/IfMatch'
      - $ref: '../openapi.yaml#/components/parameters/IdempotencyKey'
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/ClosePlaySessionRequest'
          examples:
            close:
              value:
                force: false
                generateShare: false
    responses:
      '200':
        description: Jogatina encerrada; pódio congelado.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ClosePlaySessionResponse'
            example:
              id: 7c8d9e0f-1a2b-4c3d-8e4f-000000000001
              status: CLOSED
              closedAt: '2026-07-15T01:15:00Z'
              closedBy: { id: 11111111-1111-4111-8111-111111111111, username: baroni, displayName: Rodrigo Baroni, initials: RB, avatarColor: '#C1E778' }
              closedReason: MANUAL
              finalPodium:
                - { position: 1, medal: GOLD, userId: 11111111-1111-4111-8111-111111111111, displayName: Rodrigo Baroni, wins: 4, losses: 0 }
                - { position: 2, medal: SILVER, userId: 33333333-3333-4333-8333-333333333333, displayName: Felipe Costa, wins: 3, losses: 1 }
                - { position: 3, medal: BRONZE, userId: 22222222-2222-4222-8222-222222222222, displayName: João Pereira, wins: 2, losses: 2 }
                - { position: 4, medal: null, userId: 44444444-4444-4444-8444-444444444444, displayName: Anderson Lima, wins: 0, losses: 6 }
              counters: { matchesCount: 9, participantsCount: 4 }
              shareArtifactId: null
              version: 11
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../openapi.yaml#/components/responses/Forbidden'
      '404':
        $ref: '../openapi.yaml#/components/responses/NotFound'
      '409':
        $ref: '../openapi.yaml#/components/responses/Conflict'
      '428':
        $ref: '../openapi.yaml#/components/responses/PreconditionRequired'

PlaySessionReopen:
  post:
    operationId: reopenPlaySession
    summary: Reabrir jogatina
    description: |
      Requer `ADMIN`/`OWNER`, até **12 h** após o fechamento, com motivo obrigatório.
      Gera `AuditLog(SESSION_REOPENED)`.
    tags: [PlaySessions]
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/PlaySessionIdPath'
      - $ref: '../openapi.yaml#/components/parameters/IfMatchOptional'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/ReopenPlaySessionRequest'
          examples:
            reopen:
              value:
                reason: Fechamos por engano, ainda tem gente jogando
    responses:
      '200':
        description: Jogatina reaberta.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/PlaySession'
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../openapi.yaml#/components/responses/Forbidden'
      '404':
        $ref: '../openapi.yaml#/components/responses/NotFound'
      '409':
        $ref: '../openapi.yaml#/components/responses/Conflict'
      '422':
        $ref: '../openapi.yaml#/components/responses/UnprocessableEntity'

# ==================================================== MATCHES

Matches:
  post:
    operationId: startMatch
    summary: Iniciar partida
    description: |
      A partida nasce **`IN_PROGRESS`** — não existe estado `CREATED`, porque o
      mockup vai de "Começar partida" direto para a tela de jogo.

      Quem cria **não precisa** ser um dos jogadores (RN-MATCH-006): o organizador
      pode registrar a partida de outros dois. Um jogador só pode estar em **uma**
      partida em andamento por vez — a violação retorna
      `409 PLAYER_ALREADY_IN_MATCH` com `conflictingMatchId`, permitindo ao app
      oferecer "retomar".

      As regras da liga são **congeladas** em `rules` no momento da criação, para
      que uma mudança de configuração não reescreva o histórico.
    tags: [Matches]
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/CreateMatchRequest'
          examples:
            oneVsOne:
              summary: Rodrigo × João (partida 9 do dataset canônico)
              value:
                leagueId: 0a1b2c3d-4e5f-4a6b-8c7d-000000000001
                playSessionId: 7c8d9e0f-1a2b-4c3d-8e4f-000000000001
                participants:
                  - { userId: 11111111-1111-4111-8111-111111111111, side: 1 }
                  - { userId: 22222222-2222-4222-8222-222222222222, side: 2 }
            withoutSession:
              summary: Sem informar jogatina (resolve/abre a do dia)
              value:
                leagueId: 0a1b2c3d-4e5f-4a6b-8c7d-000000000001
                participants:
                  - { userId: 11111111-1111-4111-8111-111111111111, side: 1 }
                  - { userId: 33333333-3333-4333-8333-333333333333, side: 2 }
    responses:
      '201':
        description: Partida iniciada.
        headers:
          Location:
            $ref: '../openapi.yaml#/components/headers/Location'
          ETag:
            $ref: '../openapi.yaml#/components/headers/ETag'
          Idempotent-Replay:
            $ref: '../openapi.yaml#/components/headers/IdempotentReplay'
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Match'
            example:
              id: 3f4a5b6c-7d8e-4f90-8a1b-000000000009
              playSessionId: 7c8d9e0f-1a2b-4c3d-8e4f-000000000001
              sessionLabel: Jogatina de 14 jul
              businessDate: '2026-07-14'
              league: { id: 0a1b2c3d-4e5f-4a6b-8c7d-000000000001, name: Liga da Terça }
              venue: { id: 5e6f7a8b-9c0d-4e1f-8a2b-000000000001, name: Bar do Zé }
              status: IN_PROGRESS
              resultStatus: ORIGINAL
              gameMode: ONE_VS_ONE
              rules: { trackPocketedBalls: true, trackFouls: true, ballsCount: 8 }
              winnerSide: null
              startedAt: '2026-07-15T00:47:00Z'
              finishedAt: null
              durationSeconds: null
              createdBy: { id: 11111111-1111-4111-8111-111111111111, username: baroni, displayName: Rodrigo Baroni, initials: RB, avatarColor: '#C1E778' }
              finishedBy: null
              participants:
                - userId: 11111111-1111-4111-8111-111111111111
                  username: baroni
                  displayName: Rodrigo Baroni
                  avatarUrl: null
                  initials: RB
