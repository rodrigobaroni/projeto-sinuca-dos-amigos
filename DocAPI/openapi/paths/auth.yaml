# paths/auth.yaml — cadastro, sessão, senha e verificação de e-mail

Register:
  post:
    operationId: register
    summary: Cadastrar usuário (conclusão do wizard de 6 etapas)
    description: |
      Cria a conta, emite tokens e dispara o e-mail de verificação. As 6 etapas são
      de UI; o servidor recebe o payload completo numa **única transação** — não
      existe usuário parcialmente criado (RN-AUTH-006).

      **Anti-enumeração (DP-030):** se o e-mail já existir, a resposta é `202` com
      `{"status":"VERIFICATION_SENT"}` e um e-mail informando a tentativa — nunca
      `409 EMAIL_TAKEN`, que revelaria a base.
    tags: [Auth]
    security: []
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/IdempotencyKey'
      - $ref: '../openapi.yaml#/components/parameters/AppVersion'
      - $ref: '../openapi.yaml#/components/parameters/AcceptLanguage'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/RegisterRequest'
          examples:
            complete:
              summary: Cadastro completo
              value:
                fullName: Rodrigo Baroni
                username: baroni
                email: rodrigo.baroni@email.com
                password: Sinuca@2026
                acceptedTermsVersion: '2026-06-01'
                timezone: America/Sao_Paulo
                locale: pt-BR
                deviceInfo:
                  deviceId: b1c2d3e4-f5a6-4b7c-8d9e-000000000001
                  deviceName: iPhone 15 de Rodrigo
                  platform: IOS
    responses:
      '201':
        description: Conta criada; tokens emitidos.
        headers:
          Location:
            $ref: '../openapi.yaml#/components/headers/Location'
          Cache-Control:
            schema:
              type: string
            example: no-store
          Idempotent-Replay:
            $ref: '../openapi.yaml#/components/headers/IdempotentReplay'
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/AuthSession'
            example:
              accessToken: eyJhbGciOiJSUzI1NiIsImtpZCI6ImVuYy0yMDI2LTAzIn0.eyJzdWIiOiIxMTExMTExMS0xMTExLTQxMTEtODExMS0xMTExMTExMTExMTEifQ.mS4k
              refreshToken: v1.MWY0YTNiMmMtOGQ5ZS00ZjcwLTgxMmItMDAwMDAwMDAwMDAx.7Rq2xK9mZ0pL
              tokenType: Bearer
              expiresIn: 900
              refreshExpiresIn: 2592000
              user:
                id: 11111111-1111-4111-8111-111111111111
                username: baroni
                displayName: Rodrigo Baroni
                email: rodrigo.baroni@email.com
                avatarUrl: null
                initials: RB
                avatarColor: '#C1E778'
                status: PENDING_VERIFICATION
                emailVerified: false
                memberSince: '2026-07-27'
                timezone: America/Sao_Paulo
                locale: pt-BR
                profileVisibility: FRIENDS_ONLY
                searchableByUsername: true
                createdAt: '2026-07-27T18:30:00Z'
                updatedAt: '2026-07-27T18:30:00Z'
                version: 1
      '202':
        description: E-mail já cadastrado — resposta indistinguível de sucesso (anti-enumeração).
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  const: VERIFICATION_SENT
                message:
                  type: string
            example:
              status: VERIFICATION_SENT
              message: Enviamos um e-mail com as instruções.
      '400':
        $ref: '../openapi.yaml#/components/responses/BadRequest'
      '422':
        $ref: '../openapi.yaml#/components/responses/UnprocessableEntity'
      '429':
        $ref: '../openapi.yaml#/components/responses/TooManyRequests'
      '500':
        $ref: '../openapi.yaml#/components/responses/InternalError'

Login:
  post:
    operationId: login
    summary: Autenticar por e-mail e senha
    description: |
      Resposta única (`401 INVALID_CREDENTIALS`) para e-mail inexistente, senha
      errada **ou** conta bloqueada, com tempo de resposta normalizado
      (RN-AUTH-015). Conta `DEACTIVATED` é **reativada** automaticamente.
    tags: [Auth]
    security: []
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/AppVersion'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/LoginRequest'
          examples:
            login:
              value:
                email: rodrigo.baroni@email.com
                password: Sinuca@2026
                deviceInfo:
                  deviceId: b1c2d3e4-f5a6-4b7c-8d9e-000000000001
                  deviceName: iPhone 15 de Rodrigo
                  platform: IOS
    responses:
      '200':
        description: Autenticado.
        headers:
          Cache-Control:
            schema:
              type: string
            example: no-store
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/AuthSession'
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../openapi.yaml#/components/responses/Forbidden'
      '422':
        $ref: '../openapi.yaml#/components/responses/UnprocessableEntity'
      '429':
        $ref: '../openapi.yaml#/components/responses/TooManyRequests'

Refresh:
  post:
    operationId: refreshTokens
    summary: Renovar par de tokens
    description: |
      O refresh token é **rotacionado a cada uso**. Reapresentar um token já
      rotacionado indica roubo: **toda a família de sessão é revogada**
      (RN-AUTH-014).

      O cliente deve **serializar** refreshes concorrentes — três chamadas
      simultâneas derrubariam a sessão.
    tags: [Auth]
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/RefreshRequest'
          examples:
            refresh:
              value:
                refreshToken: v1.MWY0YTNiMmMtOGQ5ZS00ZjcwLTgxMmItMDAwMDAwMDAwMDAx.7Rq2xK9mZ0pL
    responses:
      '200':
        description: Novo par emitido; o token anterior foi revogado.
        headers:
          Cache-Control:
            schema:
              type: string
            example: no-store
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/AuthTokens'
            example:
              accessToken: eyJhbGciOiJSUzI1NiIsImtpZCI6ImVuYy0yMDI2LTAzIn0.eyJzdWIiOiIxMTExMTExMS0xMTExLTQxMTEtODExMS0xMTExMTExMTExMTEiLCJleHAiOjE3ODQxNTE1MDB9.Xa9
              refreshToken: v1.NGE1YjZjN2QtOGU5Zi00MDAxLTgyM2MtMDAwMDAwMDAwMDAy.Kp8mQ2vN4tR
              tokenType: Bearer
              expiresIn: 900
              refreshExpiresIn: 2592000
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '429':
        $ref: '../openapi.yaml#/components/responses/TooManyRequests'

Logout:
  post:
    operationId: logout
    summary: Encerrar sessão
    description: |
      Revoga a sessão corrente (ou todas com `allSessions=true`), coloca o `jti`
      do access token na denylist e desregistra o device de push.
    tags: [Auth]
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/LogoutRequest'
          examples:
            single:
              summary: Sessão atual
              value:
                refreshToken: v1.NGE1YjZjN2QtOGU5Zi00MDAxLTgyM2MtMDAwMDAwMDAwMDAy.Kp8mQ2vN4tR
                allSessions: false
            all:
              summary: Todas as sessões
              value:
                allSessions: true
    responses:
      '204':
        description: Sessão encerrada.
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'

PasswordForgot:
  post:
    operationId: requestPasswordReset
    summary: Solicitar recuperação de senha
    description: |
      Responde **sempre `202`**, com o mesmo tempo de resposta, exista ou não a
      conta (RN-AUTH-010). O token do e-mail vale **30 minutos** e é de uso único.
    tags: [Auth]
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/PasswordForgotRequest'
          examples:
            forgot:
              value:
                email: rodrigo.baroni@email.com
    responses:
      '202':
        description: Solicitação aceita (resposta idêntica para e-mail existente ou não).
        content:
          application/json:
            schema:
              type: object
              required: [status, message]
              properties:
                status:
                  type: string
                  const: ACCEPTED
                message:
                  type: string
            example:
              status: ACCEPTED
              message: Se existir uma conta com esse e-mail, enviaremos as instruções em instantes.
      '422':
        $ref: '../openapi.yaml#/components/responses/UnprocessableEntity'
      '429':
        $ref: '../openapi.yaml#/components/responses/TooManyRequests'

PasswordReset:
  post:
    operationId: resetPassword
    summary: Redefinir senha com token
    description: Troca a senha e **revoga todas as sessões** do usuário (RN-AUTH-011).
    tags: [Auth]
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/PasswordResetRequest'
          examples:
            reset:
              value:
                token: rst_9f8e7d6c5b4a43928180000000000001
                newPassword: NovaSinuca@2026
    responses:
      '200':
        description: Senha alterada; sessões revogadas.
        content:
          application/json:
            schema:
              type: object
              required: [status, sessionsRevoked]
              properties:
                status:
                  type: string
                  const: PASSWORD_RESET
                sessionsRevoked:
                  type: integer
                message:
                  type: string
            example:
              status: PASSWORD_RESET
              sessionsRevoked: 3
              message: Senha alterada. Faça login novamente.
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '410':
        $ref: '../openapi.yaml#/components/responses/Gone'
      '422':
        $ref: '../openapi.yaml#/components/responses/UnprocessableEntity'
      '429':
        $ref: '../openapi.yaml#/components/responses/TooManyRequests'

PasswordChange:
  post:
    operationId: changePassword
    summary: Alterar senha (autenticado)
    description: |
      Exige a senha atual. Revoga todas as **outras** sessões, mantendo a corrente
      quando `keepCurrentSession = true` (RN-AUTH-012).
    tags: [Auth]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/PasswordChangeRequest'
          examples:
            change:
              value:
                currentPassword: Sinuca@2026
                newPassword: OutraSinuca@2027
                keepCurrentSession: true
    responses:
      '200':
        description: Senha alterada.
        content:
          application/json:
            schema:
              type: object
              required: [status, sessionsRevoked, changedAt]
              properties:
                status:
                  type: string
                  const: PASSWORD_CHANGED
                sessionsRevoked:
                  type: integer
                changedAt:
                  type: string
                  format: date-time
            example:
              status: PASSWORD_CHANGED
              sessionsRevoked: 2
              changedAt: '2026-07-27T18:35:41Z'
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '422':
        $ref: '../openapi.yaml#/components/responses/UnprocessableEntity'
      '429':
        $ref: '../openapi.yaml#/components/responses/TooManyRequests'

EmailVerify:
  post:
    operationId: verifyEmail
    summary: Verificar e-mail
    description: Token de uso único com validade de 24 h. Ativa a conta (`status = ACTIVE`).
    tags: [Auth]
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/TokenRequest'
          examples:
            verify:
              value:
                token: evt_2b3c4d5e6f7048129a34000000000001
    responses:
      '200':
        description: E-mail verificado.
        content:
          application/json:
            schema:
              type: object
              required: [status, userId, verifiedAt]
              properties:
                status:
                  type: string
                  const: EMAIL_VERIFIED
                userId:
                  $ref: '../components/schemas.yaml#/Uuid'
                verifiedAt:
                  type: string
                  format: date-time
            example:
              status: EMAIL_VERIFIED
              userId: 11111111-1111-4111-8111-111111111111
              verifiedAt: '2026-07-27T18:41:03Z'
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '409':
        $ref: '../openapi.yaml#/components/responses/Conflict'
      '410':
        $ref: '../openapi.yaml#/components/responses/Gone'

EmailVerifyResend:
  post:
    operationId: resendEmailVerification
    summary: Reenviar e-mail de verificação
    description: Limitado a 1 por minuto e 5 por dia.
    tags: [Auth]
    responses:
      '202':
        description: Reenvio agendado.
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  const: ACCEPTED
                nextResendAvailableAt:
                  type: string
                  format: date-time
            example:
              status: ACCEPTED
              nextResendAvailableAt: '2026-07-27T18:42:03Z'
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '409':
        $ref: '../openapi.yaml#/components/responses/Conflict'
      '429':
        $ref: '../openapi.yaml#/components/responses/TooManyRequests'
