        código de erro (`INVITE_CODE_EXPIRED`, `_REVOKED`, `_EXHAUSTED`), para o app
        dar a mensagem certa (RN-INVITE-009).
      tags:
        - Leagues
        - Invitations
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinByCodeRequest'
            examples:
              lowercase:
                summary: Aceita minúsculas
                value:
                  code: terca-7k9m
      responses:
        '201':
          description: Entrou na liga.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinLeagueResponse'
              example:
                leagueId: 0a1b2c3d-4e5f-4a6b-8c7d-000000000001
                leagueName: Liga da Terça
                membership:
                  role: PLAYER
                  status: ACTIVE
                  joinedAt: '2026-07-28T14:10:00Z'
                  joinedVia: INVITE_CODE
                ranking:
                  position: 6
                  wins: 0
                  losses: 0
                  winRate: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /leagues/{leagueId}:
    get:
      operationId: getLeague
      summary: Consultar detalhes da liga
      description: |
        Membros recebem o recurso completo. Em liga `PUBLIC`, não-membros recebem uma
        visão resumida com `canJoin: true`. Em liga `PRIVATE` sem vínculo, `404`.

        `permissions` é calculado pelo servidor — o app não reimplementa autorização.
        `rules.locked = true` indica que os campos de jogo devem estar desabilitados na UI.
      tags:
        - Leagues
      parameters:
        - $ref: '#/components/parameters/LeagueIdPath'
        - name: include
          in: query
          schema:
            type: string
          example: currentSession
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Detalhes da liga.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/League'
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateLeague
      summary: Editar liga
      description: |
        Requer `ADMIN` ou `OWNER`. Após a **primeira partida finalizada**, `gameMode`
        e as regras de marcação tornam-se imutáveis (`409 LEAGUE_RULES_LOCKED`,
        RN-LEAGUE-009). Também é este endpoint que atrela/desatrela um local
        (`venueId` / `null`).
      tags:
        - Leagues
      parameters:
        - $ref: '#/components/parameters/LeagueIdPath'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLeagueRequest'
            examples:
              config:
                summary: Salvar aba Config
                value:
                  name: Liga da Terça
                  venueId: 5e6f7a8b-9c0d-4e1f-8a2b-000000000001
                  rules:
                    trackFouls: true
              attachVenue:
                summary: Atrelar liga a um local
                value:
                  venueId: 5e6f7a8b-9c0d-4e1f-8a2b-000000000001
              detachVenue:
                summary: Desatrelar local
                value:
                  venueId: null
      responses:
        '200':
          description: Liga atualizada.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/League'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
    delete:
      operationId: deleteLeague
      summary: Excluir liga
      description: |
        Somente `OWNER` e somente se a liga **nunca** teve partida finalizada
        (`409 LEAGUE_HAS_HISTORY`). Caso contrário, use `POST /finish`.
      tags:
        - Leagues
      parameters:
        - $ref: '#/components/parameters/LeagueIdPath'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Liga excluída.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /leagues/{leagueId}/finish:
    post:
      operationId: finishLeague
      summary: Encerrar liga
      description: |
        Somente `OWNER`. **Congela o ranking final**, fecha jogatinas, cancela
        partidas em aberto (com `force`), expira convites, revoga códigos e notifica
        os membros.
      tags:
        - Leagues
      parameters:
        - $ref: '#/components/parameters/LeagueIdPath'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinishLeagueRequest'
            examples:
              finish:
                value:
                  reason: Fim do semestre
                  force: false
      responses:
        '200':
          description: Liga encerrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinishLeagueResponse'
              example:
                id: 0a1b2c3d-4e5f-4a6b-8c7d-000000000003
                name: Copa Fim de Ano
                status: FINISHED
                finishedAt: '2026-07-27T19:20:00Z'
                finishedBy:
                  id: 11111111-1111-4111-8111-111111111111
                  username: baroni
                  displayName: Rodrigo Baroni
                  initials: RB
                  avatarColor: '#C1E778'
                finalRanking:
                  frozenAt: '2026-07-27T19:20:00Z'
                  champion:
                    userId: 33333333-3333-4333-8333-333333333333
                    displayName: Felipe Costa
                    wins: 12
                    losses: 6
                    winRate: 66.67
                  entriesCount: 6
                sideEffects:
                  sessionsClosed: 0
                  matchesCancelled: 0
                  invitationsExpired: 2
                  inviteCodesRevoked: 1
                version: 12
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /leagues/{leagueId}/join:
    post:
      operationId: joinLeague
      summary: Entrar em liga pública
      description: |
        Entrada direta quando `joinPolicy = OPEN`. Se a liga exigir aprovação
        (`DP-006`), responde `202` com solicitação pendente.
      tags:
        - Leagues
        - LeagueMembers
      parameters:
        - $ref: '#/components/parameters/LeagueIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Membro criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinLeagueResponse'
              example:
                leagueId: 0a1b2c3d-4e5f-4a6b-8c7d-000000000002
                leagueName: Ranking do Bar do Zé
                membership:
                  role: PLAYER
                  status: ACTIVE
                  joinedAt: '2026-07-27T19:30:00Z'
                  joinedVia: PUBLIC_JOIN
                ranking:
                  position: 9
                  wins: 0
                  losses: 0
                  winRate: 0
        '202':
          description: Solicitação de entrada pendente de aprovação.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: PENDING_APPROVAL
                  requestId:
                    $ref: '#/components/schemas/Uuid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /leagues/{leagueId}/leave:
    post:
      operationId: leaveLeague
      summary: Sair da liga
      description: |
        O `OWNER` precisa **transferir a propriedade** antes de sair
        (`409 OWNER_MUST_TRANSFER`, com `eligibleSuccessors[]`). Se for o único
        membro, sair encerra a liga. O histórico de partidas é preservado.
      tags:
        - LeagueMembers
      parameters:
        - $ref: '#/components/parameters/LeagueIdPath'
      responses:
        '200':
          description: Era o único membro — a liga foi encerrada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  leagueFinished:
                    type: boolean
              example:
                leagueFinished: true
        '204':
          description: Saiu da liga.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
