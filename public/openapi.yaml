  /venues:
    get:
      operationId: searchVenues
      summary: Buscar locais (proximidade ou texto)
      description: |
        Alimenta o mapa da aba Locais e o autocomplete de local do wizard.

        É obrigatório informar **`lat`+`lng`**, **`q`** ou **`city`**.
        `distanceKm` só aparece quando o cliente envia coordenadas.

        **Privacidade:** as coordenadas do usuário **não são persistidas nem
        logadas** (RN-PRIV-002) — os parâmetros são removidos do log de acesso por
        filtro dedicado. O backend também não chama nenhuma API de mapas de terceiro
        no caminho da requisição.
      tags:
        - Venues
      parameters:
        - name: lat
          in: query
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
          example: -23.5583
        - name: lng
          in: query
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
          example: -46.6604
        - name: radiusKm
          in: query
          schema:
            type: number
            minimum: 0.1
            maximum: 50
            default: 5
        - $ref: '#/components/parameters/SearchQuery'
        - name: city
          in: query
          schema:
            type: string
            maxLength: 80
        - name: openNow
          in: query
          description: Filtra por horário de funcionamento no fuso do **local**.
          schema:
            type: boolean
            default: false
        - name: maxPricePerHour
          in: query
          schema:
            type: number
            minimum: 0
        - name: minRating
          in: query
          schema:
            type: number
            minimum: 0
            maximum: 5
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - distance
              - rating
              - pricePerHour
              - name
        - name: fields
          in: query
          description: '`map` devolve apenas o necessário para os pins.'
          schema:
            type: string
            enum:
              - full
              - map
            default: full
      responses:
        '200':
          description: Locais encontrados, ordenados por distância.
