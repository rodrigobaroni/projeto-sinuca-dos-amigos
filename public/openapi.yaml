                              leagueId: 0a1b2c3d-4e5f-4a6b-8c7d-000000000001
                              leagueName: Liga da Terça
                              sessionStartsAt: '2026-07-28T23:00:00Z'
                              venueId: 5e6f7a8b-9c0d-4e1f-8a2b-000000000001
                              venueName: Bar do Zé
                            actions: []
                            deepLink: encacapei://leagues/0a1b2c3d-4e5f-4a6b-8c7d-000000000001
                            icon: CLOCK
                            readAt: null
                            resolvedAt: null
                            expiresAt: '2026-07-28T23:00:00Z'
                            createdAt: '2026-07-28T22:00:00Z'
                    meta:
                      totalItems: 3
                      unreadCount: 3
                      pageSize: 50
                      hasMore: false
                      nextCursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      operationId: clearNotificationHistory
      summary: Limpar histórico de notificações
      description: |
        `scope=READ` (default) apaga apenas notificações **lidas ou já resolvidas** —
        convites pendentes acionáveis **sobrevivem** (RN-NOTIF-005). Perder um convite
        por ter tocado em "Limpar histórico" é pior que uma lista comprida.
        `keptReason` permite à UI explicar por que alguns itens ficaram.
      tags:
        - Notifications
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum:
              - READ
              - ALL
            default: READ
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/NotificationCategory'
        - name: olderThan
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Histórico limpo.
          content:
            application/json:
              schema:
                type: object
                required:
                  - deletedCount
                  - keptCount
                  - unreadCount
                properties:
                  deletedCount:
                    type: integer
                  keptCount:
                    type: integer
                  keptReason:
                    type:
                      - string
                      - 'null'
                    enum:
                      - PENDING_ACTION
                      - null
                  unreadCount:
                    type: integer
              example:
                deletedCount: 41
                keptCount: 2
                keptReason: PENDING_ACTION
                unreadCount: 2
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/notifications/unread-count:
    get:
      operationId: getUnreadCount
      summary: Contador de notificações não lidas
      description: |
        Fonte dos badges do app. Endpoint de altíssima frequência (chamado a cada
        foreground) — servido de cache Redis com TTL de 30 s, invalidado por evento.
      tags:
        - Notifications
      responses:
        '200':
          description: Contadores.
          headers:
            Cache-Control:
              schema:
                type: string
              example: private, max-age=30
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCount'
              example:
                total: 3
                byCategory:
                  LEAGUE_INVITATIONS: 1
                  FRIEND_REQUESTS: 1
                  SESSION_ALERTS: 1
                  MATCH_RESULTS: 0
                  LEAGUE_UPDATES: 0
                  SYSTEM: 0
                pendingActions: 2
                computedAt: '2026-07-28T22:05:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/notifications/read:
    post:
      operationId: markNotificationsRead
      summary: Marcar várias (ou todas) como lidas
      tags:
        - Notifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkReadRequest'
            examples:
              all:
                summary: Todas
                value:
                  all: true
              byCategory:
                summary: Por categoria
                value:
                  category: SESSION_ALERTS
              byIds:
                summary: Por IDs
                value:
                  notificationIds:
                    - 2b3c4d5e-6f70-4812-9a34-000000000001
                    - 2b3c4d5e-6f70-4812-9a34-000000000002
      responses:
        '200':
          description: Notificações marcadas.
          content:
            application/json:
              schema:
                type: object
                required:
                  - markedCount
                  - unreadCount
                properties:
                  markedCount:
                    type: integer
                  unreadCount:
                    type: integer
                  readAt:
                    type: string
                    format: date-time
              example:
                markedCount: 3
                unreadCount: 0
                readAt: '2026-07-28T22:06:30Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /me/notifications/{notificationId}:
    delete:
      operationId: deleteNotification
      summary: Excluir notificação
      description: |
        Soft delete. Notificação **acionável e pendente** exige `force=true`
        (`409 NOTIFICATION_HAS_PENDING_ACTION`).
      tags:
        - Notifications
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: force
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '204':
          description: Notificação excluída.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/notifications/{notificationId}/read:
    post:
      operationId: markNotificationRead
      summary: Marcar notificação como lida
      description: Idempotente — repetir devolve o `readAt` original.
      tags:
        - Notifications
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: 2b3c4d5e-6f70-4812-9a34-000000000003
      responses:
        '200':
          description: Notificação marcada como lida.
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - readAt
                  - unreadCount
                properties:
                  id:
                    $ref: '#/components/schemas/Uuid'
                  readAt:
                    type: string
                    format: date-time
                  unreadCount:
                    type: integer
              example:
                id: 2b3c4d5e-6f70-4812-9a34-000000000003
                readAt: '2026-07-28T22:06:11Z'
                unreadCount: 2
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/notification-preferences:
    get:
      operationId: getNotificationPreferences
      summary: Consultar preferências de notificação
      description: |
        `locked: true` em `SYSTEM` — avisos de segurança não podem ser desligados
        (RN-NOTIF-009). `pushAvailable: false` no MVP faz o app esconder a coluna de
        push em vez de mostrar um toggle inútil.
      tags:
        - Notifications
      responses:
        '200':
          description: Preferências atuais.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
              example:
                items:
                  - category: LEAGUE_INVITATIONS
                    label: Convites de liga
                    inAppEnabled: true
                    pushEnabled: true
                    emailEnabled: false
                    locked: false
                  - category: FRIEND_REQUESTS
                    label: Convites de amigos
                    inAppEnabled: true
                    pushEnabled: true
                    emailEnabled: false
                    locked: false
                  - category: SESSION_ALERTS
                    label: Avisos de jogatina
                    inAppEnabled: true
                    pushEnabled: true
                    emailEnabled: false
                    locked: false
                  - category: MATCH_RESULTS
                    label: Resultados
                    inAppEnabled: true
                    pushEnabled: false
                    emailEnabled: false
                    locked: false
                  - category: LEAGUE_UPDATES
                    label: Novidades da liga
                    inAppEnabled: true
                    pushEnabled: false
                    emailEnabled: false
                    locked: false
                  - category: SYSTEM
                    label: Avisos do sistema
                    inAppEnabled: true
                    pushEnabled: true
                    emailEnabled: true
                    locked: true
                quietHours:
                  enabled: true
                  startTime: '23:30'
                  endTime: '08:00'
                  timezone: America/Sao_Paulo
                pushAvailable: false
                pushUnavailableReason: FEATURE_DISABLED
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: updateNotificationPreferences
      summary: Atualizar preferências de notificação
      tags:
        - Notifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationPreferencesRequest'
            examples:
              update:
                value:
                  items:
                    - category: MATCH_RESULTS
                      pushEnabled: true
                    - category: LEAGUE_UPDATES
                      inAppEnabled: false
                  quietHours:
                    enabled: true
                    startTime: '23:30'
                    endTime: '08:00'
                    timezone: America/Sao_Paulo
      responses:
        '200':
          description: Preferências atualizadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /me/devices:
    post:
      operationId: registerDevice
      summary: Registrar device para push
      description: |
        Upsert por `pushToken`. **Entra no MVP mesmo com push desligado**, para que a
        base de tokens já exista quando o Notification Hubs for ativado — evitando
        esperar um ciclo de atualização nas lojas.
      tags:
        - Notifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceRequest'
            examples:
              ios:
                value:
                  pushToken: fA9kZ2mQ8pR4vN6sL1yB3cW7zA5dF0hGeUxT2nJ8kM4vC6bY1hL5jD7sF3gApQ9w
                  platform: IOS
                  deviceId: b1c2d3e4-f5a6-4b7c-8d9e-000000000001
                  deviceName: iPhone 15 de Rodrigo
                  appVersion: 1.0.0
                  osVersion: '18.2'
                  locale: pt-BR
      responses:
        '200':
          description: Device registrado (ou atualizado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
              example:
                id: e7f8a9b0-c1d2-4e3f-8a4b-000000000001
                platform: IOS
                deviceName: iPhone 15 de Rodrigo
                registeredAt: '2026-07-28T22:10:00Z'
                lastSeenAt: '2026-07-28T22:10:00Z'
                pushEnabled: false
                note: Push notifications ainda não estão habilitadas nesta versão do produto.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/devices/{deviceId}:
    delete:
      operationId: unregisterDevice
      summary: Remover device
      description: Chamado no logout.
      tags:
        - Notifications
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: e7f8a9b0-c1d2-4e3f-8a4b-000000000001
      responses:
        '204':
          description: Device removido.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /share-artifacts/{shareArtifactId}:
    get:
      operationId: getShareArtifact
      summary: Consultar status da geração do card
      description: 'Polling recomendado com backoff: 1 s, 2 s, 4 s, 8 s; desistir em 30 s.'
      tags:
        - Sharing
      parameters:
        - name: shareArtifactId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: 4c5d6e7f-8091-42a3-b5c6-000000000002
      responses:
        '200':
          description: Status do artefato.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareArtifact'
              examples:
                ready:
                  value:
                    id: 4c5d6e7f-8091-42a3-b5c6-000000000002
                    kind: SESSION_PODIUM
                    format: IMAGE_STORY
                    status: READY
                    publicToken: Rq9wT4nZ8kM2xC6vB1yH5jL0pD7sF3gA-eK
                    shareUrl: https://encacapei.com.br/p/Rq9wT4nZ8kM2xC6vB1yH5jL0pD7sF3gA-eK
                    imageUrl: https://cdn.encacapei.com.br/shares/4c5d6e7f-8091-42a3-b5c6-000000000002/story.png
                    imageWidth: 1080
                    imageHeight: 1920
                    imageSizeBytes: 214512
                    visibilityLevel: MINIMAL
                    snapshotFrozenAt: '2026-07-15T01:10:30Z'
                    viewCount: 0
                    expiresAt: '2026-08-14T01:10:30Z'
                    createdAt: '2026-07-15T01:10:30Z'
                    failureReason: null
                failed:
                  value:
                    id: 4c5d6e7f-8091-42a3-b5c6-000000000002
                    kind: SESSION_PODIUM
                    format: IMAGE_STORY
                    status: FAILED
                    publicToken: Rq9wT4nZ8kM2xC6vB1yH5jL0pD7sF3gA-eK
                    shareUrl: https://encacapei.com.br/p/Rq9wT4nZ8kM2xC6vB1yH5jL0pD7sF3gA-eK
                    imageUrl: null
                    visibilityLevel: MINIMAL
                    snapshotFrozenAt: '2026-07-15T01:10:30Z'
                    viewCount: 0
                    expiresAt: '2026-08-14T01:10:30Z'
                    createdAt: '2026-07-15T01:10:30Z'
                    failureReason: RENDER_TIMEOUT
                    retryable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: revokeShareArtifact
      summary: Revogar compartilhamento
      description: |
        O link passa a responder `410` e a imagem é removida do CDN.
        Permitido ao criador ou a `ADMIN`/`OWNER` da liga. Gera `AuditLog`.
      tags:
        - Sharing
      parameters:
        - name: shareArtifactId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Compartilhamento revogado.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /public/shares/{publicToken}:
    get:
      operationId: getPublicShare
      summary: Consultar compartilhamento público
      description: |
        **Endpoint público** — qualquer pessoa com o link acessa, sem autenticação.

        O conteúdo é **minimizado** (`DP-004`, RN-SHARE-004): nomes vêm como
        "Rodrigo B." (primeiro nome + inicial), e são deliberadamente omitidos
        `userId`, `username`, avatar real, `leagueId`, `playSessionId`, e-mail,
        estatísticas gerais e link para perfil. Quem optou por não aparecer vira
        "Jogador", sem iniciais.

        Resposta serve `X-Robots-Tag: noindex, nofollow` — nome de pessoa física não
        é indexado.
      tags:
        - Sharing
      security: []
      parameters:
        - name: publicToken
          in: path
          required: true
          schema:
            type: string
            minLength: 32
            maxLength: 64
          example: Jt7xK2mQ9pR4vN8sL1yB6cW3zA5dF0hG-eU
      responses:
        '200':
          description: Resumo público minimizado.
          headers:
            Cache-Control:
              schema:
                type: string
              example: public, max-age=600
            X-Robots-Tag:
              schema:
                type: string
              example: noindex, nofollow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicShare'
              example:
                kind: SESSION_PODIUM
                date: '2026-07-14'
                label: Jogatina de 14 jul
                leagueName: Liga da Terça
                venueName: Bar do Zé
                city: São Paulo
                podium:
                  - position: 1
                    medal: GOLD
                    name: Rodrigo B.
                    initials: RB
                    avatarColor: '#C1E778'
                    wins: 4
                  - position: 2
                    medal: SILVER
                    name: Felipe C.
                    initials: FE
                    avatarColor: '#f4a261'
                    wins: 3
                  - position: 3
                    medal: BRONZE
                    name: João P.
                    initials: JO
                    avatarColor: '#8ecae6'
                    wins: 2
                  - position: 4
                    medal: null
                    name: Anderson L.
                    initials: AN
                    avatarColor: '#e9c46a'
                    wins: 0
                totalMatches: 9
                imageUrl: null
                appDeepLink: encacapei://play-sessions/7c8d9e0f-1a2b-4c3d-8e4f-000000000001
                appStoreUrl: https://encacapei.com.br/app
                expiresAt: '2026-08-14T01:10:00Z'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token JWT assinado em RS256, vida de 15 minutos.
        Claims: `iss`, `aud`, `sub`, `sid`, `jti`, `iat`, `exp`,
        `username`, `email_verified`, `roles`.

        **Papéis de liga não estão no token** — são resolvidos por consulta a
        cada requisição, porque mudam a qualquer momento.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        UUID gerado pelo cliente no momento em que o usuário toca no botão.
        Retry com a mesma chave e o mesmo corpo replica a resposta original.
      schema:
        type: string
        format: uuid
      example: d290f1ee-6c54-4b01-90e6-d701748f0851
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        format: uuid
      example: d290f1ee-6c54-4b01-90e6-d701748f0851
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag da versão que o cliente leu. Divergência → `409 CONCURRENT_MODIFICATION`.
      schema:
        type: string
      example: W/"7"
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
      example: W/"7"
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Cache condicional. Se igual ao ETag atual, responde `304`.
      schema:
        type: string
      example: W/"7"
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 64
      example: 0af7651916cd43dd8448eb211c80319c
    AppVersion:
      name: X-App-Version
      in: header
      required: false
      schema:
        type: string
        maxLength: 20
      example: 1.0.0 (1)
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
        default: pt-BR
      example: pt-BR
    Limit:
      name: limit
      in: query
      required: false
      description: Itens por página (paginação por cursor).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor opaco devolvido em `meta.nextCursor`. Não deve ser construído pelo cliente.
      schema:
        type: string
        maxLength: 512
      example: eyJpZCI6IjNmNGE1YjZjIiwidCI6IjIwMjYtMDctMTVUMDI6MjE6MTVaIn0
    Page:
      name: page
      in: query
      required: false
      description: Página (1-based, paginação por offset).
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SearchQuery:
      name: q
      in: query
      required: false
      description: Busca textual (mínimo 2 caracteres, acentos normalizados).
      schema:
        type: string
        minLength: 2
        maxLength: 60
      example: joao
    LeagueIdPath:
      name: leagueId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 0a1b2c3d-4e5f-4a6b-8c7d-000000000001
    UserIdPath:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 22222222-2222-4222-8222-222222222222
    MatchIdPath:
      name: matchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 3f4a5b6c-7d8e-4f90-8a1b-000000000009
    PlaySessionIdPath:
      name: playSessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 7c8d9e0f-1a2b-4c3d-8e4f-000000000001
    VenueIdPath:
      name: venueId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 5e6f7a8b-9c0d-4e1f-8a2b-000000000001
    PeriodFilter:
      name: period
      in: query
      required: false
      description: Janela temporal, calculada no fuso do usuário. Mutuamente exclusivo com `from`/`to`.
      schema:
        $ref: '#/components/schemas/Period'
    FromFilter:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date
      example: '2026-06-01'
    ToFilter:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date
      example: '2026-07-31'
  headers:
    ETag:
      description: Versão atual do recurso, para uso em `If-Match`.
      schema:
        type: string
      example: W/"7"
    Location:
      description: URI do recurso criado.
      schema:
        type: string
      example: /api/v1/matches/3f4a5b6c-7d8e-4f90-8a1b-000000000009
    RetryAfter:
      description: Segundos a aguardar antes de tentar novamente.
      schema:
        type: integer
      example: 30
    IdempotentReplay:
      description: Presente quando a resposta é a réplica de uma requisição anterior.
      schema:
        type: boolean
      example: true
    TraceId:
      description: Identificador de correlação (W3C Trace Context).
      schema:
        type: string
      example: 0af7651916cd43dd8448eb211c80319c
    RateLimitLimit:
      description: Limite de requisições na janela.
      schema:
        type: integer
      example: 60
    RateLimitRemaining:
      description: Requisições restantes na janela.
      schema:
        type: integer
      example: 57
    RateLimitReset:
      description: Epoch (segundos) em que a janela reinicia.
      schema:
        type: integer
      example: 1785177960
  responses:
    BadRequest:
      description: Requisição malformada ou header obrigatório ausente.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            idempotencyKeyRequired:
              summary: Idempotency-Key ausente
              value:
