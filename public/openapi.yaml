  /me/statistics/timeseries:
    get:
      operationId: getMyStatisticsTimeSeries
      summary: Séries temporais (gráficos de evolução da Home)
      description: |
        Dois gráficos do expander "Gráficos de evolução":

        - `metric=WIN_RATE&period=LAST_30_DAYS&granularity=DAY` — taxa de vitória
          **acumulada** (a curva suave do mockup; taxa diária seria um serrote — DP-031).
        - `metric=WINS_LOSSES&period=LAST_4_WEEKS&granularity=WEEK` — barras pareadas
          com `label` "Sem 1".."Sem 4" gerado pelo servidor.

        Agrupamento sempre no fuso do **usuário**. Semanas ISO-8601 (segunda a domingo).
      tags:
        - Users
      parameters:
        - name: metric
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/StatisticMetric'
        - $ref: '#/components/parameters/PeriodFilter'
        - name: granularity
          in: query
          schema:
            $ref: '#/components/schemas/Granularity'
        - name: leagueId
          in: query
          schema:
            type: string
            format: uuid
        - name: fillGaps
          in: query
          description: Preenche dias sem jogo, para a linha não ter buracos.
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Série temporal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeSeries'
              examples:
                winRate30d:
                  summary: Taxa de vitória — últimos 30 dias
                  value:
                    metric: WIN_RATE
                    period: LAST_30_DAYS
                    granularity: DAY
                    timezone: America/Sao_Paulo
                    from: '2026-06-28'
                    to: '2026-07-27'
                    unit: PERCENT
                    points:
                      - bucket: '2026-06-30'
                        date: '2026-06-30'
                        value: 50
                        matchesPlayed: 3
                      - bucket: '2026-07-07'
                        date: '2026-07-07'
                        value: 55.56
                        matchesPlayed: 5
                      - bucket: '2026-07-14'
                        date: '2026-07-14'
                        value: 61.7
                        matchesPlayed: 4
                    summary:
                      first: 50
                      last: 61.7
                      change: 11.7
                      trend: UP
                winsLosses4w:
                  summary: Vitórias e derrotas por semana
                  value:
                    metric: WINS_LOSSES
                    period: LAST_4_WEEKS
                    granularity: WEEK
                    timezone: America/Sao_Paulo
                    from: '2026-06-29'
                    to: '2026-07-26'
                    unit: COUNT
                    points:
                      - bucket: 2026-W27
                        weekStart: '2026-06-29'
                        weekEnd: '2026-07-05'
                        label: Sem 1
                        wins: 5
                        losses: 3
                      - bucket: 2026-W28
                        weekStart: '2026-07-06'
                        weekEnd: '2026-07-12'
                        label: Sem 2
                        wins: 4
                        losses: 4
                      - bucket: 2026-W29
                        weekStart: '2026-07-13'
                        weekEnd: '2026-07-19'
                        label: Sem 3
                        wins: 6
                        losses: 2
                      - bucket: 2026-W30
                        weekStart: '2026-07-20'
                        weekEnd: '2026-07-26'
                        label: Sem 4
                        wins: 5
                        losses: 2
                    summary:
                      totalWins: 20
                      totalLosses: 11
                      winRate: 64.52
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
