  /leagues/{leagueId}/play-sessions/current:
    get:
      operationId: getCurrentPlaySession
      summary: Obter (ou abrir) a jogatina corrente da liga
      description: |
        A operação por trás do botão **"Iniciar partida"**.

        Com `createIfMissing=true`, abre a jogatina do dia se não houver nenhuma
        (`201`); se já existir, devolve a existente (`200`). Duas chamadas simultâneas
        **nunca** criam duas jogatinas — o unique parcial `(leagueId, businessDate)`
        garante isso, e quem perde a corrida relê e recebe `200`.

        `businessDate` é calculado no **fuso da liga**, com corte deslocado quando a
        janela cruza a meia-noite: uma chamada às 00:20 local do dia 15 ainda devolve
        `2026-07-14`.
      tags:
        - PlaySessions
        - Leagues
      parameters:
        - $ref: '#/components/parameters/LeagueIdPath'
        - name: createIfMissing
          in: query
          schema:
            type: boolean
            default: false
        - name: include
          in: query
          schema:
            type: string
          example: ranking
      responses:
