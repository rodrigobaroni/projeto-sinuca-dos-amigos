                  value:
                    userId: 33333333-3333-4333-8333-333333333333
                    displayName: Felipe Costa
                    role: ADMIN
                    previousRole: PLAYER
                    status: ACTIVE
                    changedAt: '2026-07-27T19:25:00Z'
