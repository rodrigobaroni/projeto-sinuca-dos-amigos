        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /me:
    get:
      operationId: getMe
      summary: Consultar perfil autenticado
      description: |
        Com `include=statistics,counters`, entrega em **uma chamada** tudo que a Home
        precisa: perfil, os 4 KPIs e os badges de notificação e convites.
      tags:
        - Users
      parameters:
        - name: include
          in: query
          description: Projeções adicionais, separadas por vírgula.
          schema:
            type: string
          example: statistics,counters
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Perfil do usuário autenticado.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeProfile'
              example:
                id: 11111111-1111-4111-8111-111111111111
                username: baroni
                displayName: Rodrigo Baroni
                email: rodrigo.baroni@email.com
                avatarUrl: null
                initials: RB
                avatarColor: '#C1E778'
                status: ACTIVE
                emailVerified: true
                memberSince: '2025-01-14'
                timezone: America/Sao_Paulo
                locale: pt-BR
                profileVisibility: FRIENDS_ONLY
                searchableByUsername: true
                shareStatsPublicly: false
                locationConsentGrantedAt: '2026-03-02T14:20:00Z'
                createdAt: '2025-01-14T22:10:00Z'
                updatedAt: '2026-07-20T11:05:33Z'
                version: 3
                statistics:
                  matchesPlayed: 47
                  wins: 29
                  losses: 18
                  winRate: 61.7
                  currentWinStreak: 5
                  longestWinStreak: 7
                  currentLossStreak: 0
                  longestLossStreak: 2
                  sessionsPlayed: 14
                  podiumFirsts: 6
                  lastMatchAt: '2026-07-15T01:08:22Z'
                counters:
                  unreadNotifications: 3
                  pendingFriendRequests: 2
                  pendingLeagueInvitations: 1
                  activeLeagues: 2
                  activeMatchId: null
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: updateMe
      summary: Editar perfil
      description: |
        Atualização parcial com optimistic locking. Campos `id`, `email`, `status`,
        `createdAt` e `version` são **ignorados** se enviados (proteção contra mass
        assignment). Trocar de e-mail é fluxo próprio, pós-MVP.
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
            examples:
              update:
                value:
                  displayName: Rodrigo Baroni
                  username: baroni
                  profileVisibility: FRIENDS_ONLY
      responses:
        '200':
          description: Perfil atualizado.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
    delete:
      operationId: deleteMe
      summary: Excluir conta (LGPD)
      description: |
        Agenda **anonimização em 30 dias**. Login dentro do prazo cancela a exclusão.
        O histórico de partidas é preservado de forma anonimizada, para não destruir o
        ranking dos demais jogadores (RN-USER-007).
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
            examples:
              delete:
                value:
                  password: Sinuca@2026
                  confirmation: EXCLUIR MINHA CONTA
                  reason: Não jogo mais sinuca
      responses:
        '202':
          description: Exclusão agendada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAccountResponse'
              example:
                status: DELETION_SCHEDULED
                scheduledFor: '2026-08-26T18:52:00Z'
                cancelBy: '2026-08-26T18:52:00Z'
                message: Sua conta será anonimizada em 30 dias. Faça login antes disso para cancelar.
                dataRetentionNotice: Seu histórico de partidas será mantido de forma anonimizada para preservar o ranking dos demais jogadores.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /me/avatar:
    put:
      operationId: confirmAvatar
      summary: Confirmar upload de avatar
      description: |
        Valida **magic bytes** (não a extensão), remove todo EXIF — inclusive GPS
        (RN-PRIV-002) —, gera derivadas 256×256 e 64×64 em WebP e publica no CDN.
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmAvatarRequest'
            examples:
              confirm:
                value:
                  uploadToken: upl_6f2a9c1b8d3e4f5a9b0c1d2e3f4a5b6c
      responses:
        '200':
          description: Avatar publicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Avatar'
              example:
                avatarUrl: https://cdn.encacapei.com.br/avatars/11111111-1111-4111-8111-111111111111/256.webp
                thumbnailUrl: https://cdn.encacapei.com.br/avatars/11111111-1111-4111-8111-111111111111/64.webp
                updatedAt: '2026-07-27T18:44:12Z'
                version: 5
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      operationId: deleteAvatar
      summary: Remover avatar
      description: Volta a exibir as iniciais sobre `avatarColor`.
      tags:
        - Users
      responses:
        '204':
          description: Avatar removido.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/avatar/upload-url:
    post:
      operationId: requestAvatarUploadUrl
      summary: Obter URL assinada para upload de avatar
      description: |
        Devolve um SAS de escrita com TTL de 10 minutos. O app faz `PUT` **direto no
        Blob** — não passa 5 MB pelo backend em 4G de bar — e depois confirma com
        `PUT /me/avatar`.
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvatarUploadUrlRequest'
            examples:
              jpeg:
                value:
                  contentType: image/jpeg
                  contentLength: 842113
      responses:
        '200':
          description: URL de upload emitida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarUploadUrl'
              example:
                uploadUrl: https://stlftmencacapeiprd.blob.core.windows.net/avatars-staging/11111111-1111-4111-8111-111111111111/6f2a9c1b.jpg?sv=2024-11-04&se=2026-07-27T18%3A45%3A00Z&sp=cw&sig=REDACTED
                uploadToken: upl_6f2a9c1b8d3e4f5a9b0c1d2e3f4a5b6c
                method: PUT
                requiredHeaders:
                  x-ms-blob-type: BlockBlob
                  Content-Type: image/jpeg
                expiresAt: '2026-07-27T18:45:00Z'
                maxBytes: 5242880
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/statistics:
