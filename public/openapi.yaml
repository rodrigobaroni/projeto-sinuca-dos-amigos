        - OWNERSHIP_TRANSFERRED
        - SECURITY_PASSWORD_CHANGED
        - SECURITY_ALERT
    NotificationAction:
      type: object
      required:
        - key
        - label
        - style
        - method
        - href
      properties:
        key:
          type: string
          enum:
            - ACCEPT
            - DECLINE
            - VIEW
            - SHARE
            - CONTEST
        label:
          type: string
          example: Aceitar
        style:
          type: string
          enum:
            - PRIMARY
            - SECONDARY
            - DANGER
        method:
          type: string
          enum:
            - POST
            - DELETE
            - GET
        href:
          type: string
          example: /api/v1/league-invitations/8a9b0c1d-2e3f-4a5b-8c6d-000000000001/accept
    Notification:
      type: object
      required:
        - id
        - category
        - type
        - title
        - payload
        - actions
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        category:
          $ref: '#/components/schemas/NotificationCategory'
        type:
          $ref: '#/components/schemas/NotificationType'
        title:
          type: string
          maxLength: 120
          example: Liga do Churrasco te convidou
        body:
          type:
            - string
            - 'null'
          maxLength: 300
        payload:
          type: object
          additionalProperties: true
          description: IDs necessários para as ações inline.
        actions:
          type: array
          items:
            $ref: '#/components/schemas/NotificationAction'
        deepLink:
          type:
            - string
            - 'null'
          example: encacapei://league-invitations/8a9b0c1d-2e3f-4a5b-8c6d-000000000001
        icon:
          type:
            - string
            - 'null'
          enum:
            - ENVELOPE
            - USERS
            - CLOCK
            - TROPHY
            - WARNING
            - INFO
            - null
        readAt:
          type:
            - string
            - 'null'
          format: date-time
        resolvedAt:
          type:
            - string
            - 'null'
          format: date-time
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
          description: O app formata como tempo relativo ("há 2 horas"). O servidor nunca envia data relativa.
    NotificationGroup:
      type: object
      required:
        - category
        - label
        - unreadCount
        - items
      properties:
        category:
          $ref: '#/components/schemas/NotificationCategory'
        label:
          type: string
          example: Convites de liga
        unreadCount:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
    UnreadCount:
      type: object
      required:
        - total
        - byCategory
        - computedAt
      properties:
        total:
          type: integer
          example: 3
        byCategory:
          type: object
          additionalProperties:
            type: integer
          example:
            LEAGUE_INVITATIONS: 1
            FRIEND_REQUESTS: 1
            SESSION_ALERTS: 1
            MATCH_RESULTS: 0
            LEAGUE_UPDATES: 0
            SYSTEM: 0
        pendingActions:
          type: integer
          example: 2
        computedAt:
          type: string
          format: date-time
    MarkReadRequest:
      type: object
      description: Informe **exatamente uma** das três formas de seleção.
      properties:
        notificationIds:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/Uuid'
        category:
          $ref: '#/components/schemas/NotificationCategory'
        all:
          type: boolean
      oneOf:
        - required:
            - notificationIds
        - required:
            - category
        - required:
            - all
    NotificationPreference:
      type: object
      required:
        - category
        - inAppEnabled
        - pushEnabled
        - emailEnabled
      properties:
        category:
          $ref: '#/components/schemas/NotificationCategory'
        label:
          type: string
        inAppEnabled:
          type: boolean
        pushEnabled:
          type: boolean
        emailEnabled:
          type: boolean
        locked:
          type: boolean
          description: '`true` em `SYSTEM` — avisos de segurança não podem ser desligados.'
    QuietHours:
      type: object
      properties:
        enabled:
          type: boolean
        startTime:
          $ref: '#/components/schemas/TimeOfDay'
        endTime:
          $ref: '#/components/schemas/TimeOfDay'
        timezone:
          $ref: '#/components/schemas/Timezone'
    NotificationPreferences:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationPreference'
        quietHours:
          $ref: '#/components/schemas/QuietHours'
        pushAvailable:
          type: boolean
        pushUnavailableReason:
          type:
            - string
            - 'null'
          enum:
            - FEATURE_DISABLED
            - NO_DEVICE_REGISTERED
            - PERMISSION_DENIED
            - null
    UpdateNotificationPreferencesRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: object
            required:
              - category
            properties:
              category:
                $ref: '#/components/schemas/NotificationCategory'
              inAppEnabled:
                type: boolean
              pushEnabled:
                type: boolean
              emailEnabled:
                type: boolean
        quietHours:
          $ref: '#/components/schemas/QuietHours'
    RegisterDeviceRequest:
      type: object
      required:
        - pushToken
        - platform
      properties:
        pushToken:
          type: string
          minLength: 32
          maxLength: 4096
        platform:
          $ref: '#/components/schemas/DevicePlatform'
        deviceId:
          type: string
          format: uuid
        deviceName:
          type: string
          maxLength: 60
        appVersion:
          type: string
          maxLength: 20
        osVersion:
          type: string
          maxLength: 20
        locale:
          type: string
          maxLength: 10
    Device:
      type: object
      required:
        - id
        - platform
        - registeredAt
        - pushEnabled
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        platform:
          $ref: '#/components/schemas/DevicePlatform'
        deviceName:
          type:
            - string
            - 'null'
        registeredAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        pushEnabled:
          type: boolean
        note:
          type:
            - string
            - 'null'
    PublicShare:
      type: object
      description: |
        Projeção **minimizada** para consumo sem autenticação (DP-004).
        Omite deliberadamente `userId`, `username`, avatar real, `leagueId` e `playSessionId`.
      required:
        - kind
        - date
        - leagueName
        - podium
      properties:
        kind:
          $ref: '#/components/schemas/ShareKind'
        date:
          type: string
          format: date
        label:
          type: string
        leagueName:
          type: string
          example: Liga da Terça
        venueName:
          type:
            - string
            - 'null'
          example: Bar do Zé
        city:
          type:
            - string
            - 'null'
        podium:
          type: array
          items:
            type: object
            required:
              - position
              - name
              - wins
            properties:
              position:
                type: integer
              medal:
                $ref: '#/components/schemas/Medal'
              name:
                type: string
                description: Primeiro nome + inicial do sobrenome. Quem optou por não aparecer vira "Jogador".
                example: Rodrigo B.
              initials:
                type:
                  - string
                  - 'null'
              avatarColor:
                type:
                  - string
                  - 'null'
              wins:
                type: integer
        totalMatches:
          type: integer
        imageUrl:
          type:
            - string
            - 'null'
          format: uri
        appDeepLink:
          type: string
        appStoreUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
