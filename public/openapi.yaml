    post:
      operationId: recordMatchEvent
      summary: Registrar evento (bola encaçapada ou falta)
      description: |
        Toque numa bola da grade. **Endpoint mais sujeito a duplo toque** do produto:
        com chaves de idempotência diferentes, a segunda requisição cai em
        `409 BALL_ALREADY_POCKETED` (protegido por unique constraint parcial); com a
        mesma chave, é replay silencioso.

        `If-Match` é **opcional aqui, propositalmente**: exigir a versão exata numa
        tela em que dois celulares marcam bolas alternadamente geraria conflitos
        constantes sem ganho — o unique de bola já garante a invariante real. Em
        **finalização** e **correção**, `If-Match` é obrigatório.

        `suggestion` é dica de UX: quando a bola 8 cai, o app pode sugerir encerrar —
        mas o servidor **nunca** finaliza a partida sozinho (RN-EVENT-008).
      tags:
        - Matches
      parameters:
        - $ref: '#/components/parameters/MatchIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatchOptional'
      requestBody:
        required: true
        content:
