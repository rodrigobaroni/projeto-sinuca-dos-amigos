        pode registrar a partida de outros dois. Um jogador só pode estar em **uma**
        partida em andamento por vez — a violação retorna
        `409 PLAYER_ALREADY_IN_MATCH` com `conflictingMatchId`, permitindo ao app
        oferecer "retomar".

