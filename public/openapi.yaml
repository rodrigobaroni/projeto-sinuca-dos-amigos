          in: query
          schema:
            type: string
            default: FINISHED
        - name: userId
          in: query
          schema:
            type: string
            format: uuid
        - name: opponentId
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/FromFilter'
        - $ref: '#/components/parameters/ToFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: sort
          in: query
          schema:
            type: string
