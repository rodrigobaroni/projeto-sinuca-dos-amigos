    FieldError:
      type: object
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
          description: Caminho do campo em notação de ponto.
          example: password
        code:
          type: string
          description: Código estável do erro de campo.
          example: PASSWORD_MISSING_UPPERCASE
        message:
          type: string
          description: Mensagem em pt-BR para exibição.
          example: A senha deve conter ao menos uma letra maiúscula.
    ProblemDetails:
      type: object
      description: |
        Corpo padrão de erro conforme RFC 9457. Servido como `application/problem+json`.

        O cliente **deve** ramificar lógica por `code` (estável), nunca por `title`
        ou `detail` (texto apresentável, sujeito a mudança e tradução).
      required:
        - type
        - title
        - status
        - code
        - detail
        - instance
        - traceId
        - timestamp
        - retryable
      properties:
        type:
          type: string
          format: uri
          description: URI documentada e estável do tipo de problema.
          example: https://api.encacapei.com.br/problems/league-not-found
        title:
          type: string
          description: Título curto em pt-BR, fixo por `code`.
          example: Liga não encontrada
        status:
          type: integer
          minimum: 400
          maximum: 599
          example: 404
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          type: string
          description: Explicação apresentável ao usuário final; pode variar por instância.
          example: A liga informada não existe ou não está disponível para este usuário.
        instance:
          type: string
          description: Path da requisição que falhou.
          example: /api/v1/leagues/0a1b2c3d-4e5f-4a6b-8c7d-000000000009
        traceId:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: Trace ID do W3C Trace Context. Exibível na tela de erro para suporte.
          example: 0af7651916cd43dd8448eb211c80319c
        timestamp:
          type: string
          format: date-time
          example: '2026-07-28T14:02:10Z'
        retryable:
          type: boolean
          description: '`true` quando repetir a requisição idêntica pode ter sucesso (429, 503, 409 in-progress).'
          example: false
        errors:
          type: array
          description: Erros por campo. Presente em `422`; acumula **todos** os problemas encontrados.
          items:
            $ref: '#/components/schemas/FieldError'
          default: []
      additionalProperties: true
      examples:
        - type: https://api.encacapei.com.br/problems/league-not-found
          title: Liga não encontrada
          status: 404
          code: LEAGUE_NOT_FOUND
          detail: A liga informada não existe ou não está disponível para este usuário.
          instance: /api/v1/leagues/0a1b2c3d-4e5f-4a6b-8c7d-000000000009
          traceId: 0af7651916cd43dd8448eb211c80319c
          timestamp: '2026-07-28T14:02:10Z'
          retryable: false
          errors: []
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - Healthy
            - Degraded
            - Unhealthy
        checks:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              status:
                type: string
              durationMs:
                type: number
    Timezone:
      type: string
      description: Identificador IANA. Nunca offset fixo.
      maxLength: 64
      default: America/Sao_Paulo
      example: America/Sao_Paulo
    DevicePlatform:
      type: string
      enum:
        - IOS
        - ANDROID
        - WEB
    DeviceInfo:
      type: object
      properties:
        deviceId:
          type: string
          format: uuid
          example: b1c2d3e4-f5a6-4b7c-8d9e-000000000001
        deviceName:
          type: string
          maxLength: 60
          example: iPhone 15 de Rodrigo
        platform:
          $ref: '#/components/schemas/DevicePlatform'
    RegisterRequest:
      type: object
      required:
        - fullName
        - username
        - email
        - password
        - acceptedTermsVersion
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 60
          example: Rodrigo Baroni
        username:
          type: string
          pattern: ^[a-z0-9_.]{3,20}$
          example: baroni
        email:
          type: string
          format: email
          maxLength: 254
          example: rodrigo.baroni@email.com
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: |
            Deve conter maiúscula, minúscula, número e caractere especial (RN-AUTH-001).
            Cada critério violado retorna um item em `errors[]`.
          example: Sinuca@2026
        acceptedTermsVersion:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: '2026-06-01'
        timezone:
          $ref: '#/components/schemas/Timezone'
        locale:
          type: string
          default: pt-BR
          example: pt-BR
        avatarUploadToken:
          type: string
          description: Token de upload prévio do avatar (etapa 4 do cadastro).
        deviceInfo:
          $ref: '#/components/schemas/DeviceInfo'
    AuthTokens:
      type: object
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
        - refreshExpiresIn
      properties:
        accessToken:
          type: string
          description: JWT RS256 com vida de 15 minutos. Armazenar apenas em memória.
          example: eyJhbGciOiJSUzI1NiIsImtpZCI6ImVuYy0yMDI2LTAzIn0.eyJzdWIiOiIxMTExMTExMS0xMTExLTQxMTEtODExMS0xMTExMTExMTExMTEifQ.mS4k
        refreshToken:
          type: string
          description: Token opaco de 30 dias, rotacionado a cada uso. Armazenar em Keychain/Keystore.
          example: v1.MWY0YTNiMmMtOGQ5ZS00ZjcwLTgxMmItMDAwMDAwMDAwMDAx.7Rq2xK9mZ0pL
        tokenType:
          type: string
          const: Bearer
          example: Bearer
        expiresIn:
          type: integer
          description: Segundos de vida do access token.
          example: 900
        refreshExpiresIn:
          type: integer
          example: 2592000
    Uuid:
      type: string
      format: uuid
      example: 11111111-1111-4111-8111-111111111111
    UserStatus:
      type: string
      enum:
