openapi: 3.1.0
info:
  title: Encaçapei API
  version: 1.0.0
  summary: API do Encaçapei — ligas, jogatinas e partidas de sinuca entre amigos.
  description: |
    API REST do **Encaçapei**, aplicativo para organizar ligas de sinuca, registrar
    partidas na beira da mesa, gerar rankings e compartilhar o pódio da noite.

    ## Convenções

    - **Datas e horas**: ISO 8601 em **UTC** com sufixo `Z` (`2026-07-15T01:08:22Z`).
    - **Data pura**: `YYYY-MM-DD` (`businessDate`, `startsAt`).
    - **Hora pura**: `HH:mm` 24 h (`schedule.startTime`).
    - **Fuso**: identificador IANA (`America/Sao_Paulo`), nunca offset fixo.
    - **Identificadores**: UUID em `string`.
    - **Percentuais**: número `0.00`–`100.00` com 2 casas. O arredondamento para
      inteiro é responsabilidade do cliente (half-up).
    - **Coleções**: sempre `{ items, meta }`. Recursos únicos vêm sem envelope.
    - **Erros**: RFC 9457 (`application/problem+json`) com `code` estável.

    ## Autenticação

    Bearer JWT (RS256) com vida de **15 minutos**, renovado por refresh token
    opaco de **30 dias** rotacionado a cada uso. Ao receber `401 TOKEN_EXPIRED`,
    o cliente deve chamar `POST /auth/refresh` **uma vez** e repetir a requisição.

    ## Idempotência

    Todo `POST` que cria recurso ou muda estado exige o header `Idempotency-Key`
    (UUID gerado pelo cliente **no momento do toque do usuário**). Retry com a
    mesma chave e o mesmo corpo replica a resposta original com
    `Idempotent-Replay: true`.

    ## Concorrência

    Recursos versionados expõem `ETag` no `GET` e exigem `If-Match` em mutação de
    estado. Divergência retorna `409 CONCURRENT_MODIFICATION` com o estado atual
    no corpo, permitindo reconciliação sem nova leitura.

    ## Documentação completa

    Este arquivo é a especificação executável. A especificação narrativa
    (regras de negócio `RN-*`, decisões pendentes `DP-*`, modelo de dados e
    casos de teste) está nos capítulos 1 a 21 do repositório.
  contact:
    name: Time de Arquitetura — Encaçapei
    email: arquitetura@encacapei.com.br
    url: https://encacapei.com.br
  license:
    name: Proprietária
    identifier: LicenseRef-Proprietary
  termsOfService: https://encacapei.com.br/termos
servers:
  - url: https://api.encacapei.com.br/api/v1
    description: Produção
  - url: https://api-hml.encacapei.com.br/api/v1
    description: Homologação
  - url: https://localhost:5001/api/v1
    description: Desenvolvimento local
security:
  - bearerAuth: []
tags:
  - name: App
    description: Configuração remota e health check.
  - name: Auth
    description: Cadastro, login, tokens, verificação de e-mail e senha.
  - name: Users
    description: Perfil, avatar, busca de usuários, estatísticas e ciclo de vida da conta.
  - name: Friendships
    description: Convites de amizade, lista de amigos e confronto direto.
  - name: Leagues
    description: Ligas, regras, calendário, ranking e histórico.
  - name: LeagueMembers
    description: Membros, papéis, entrada e saída de liga.
  - name: Invitations
    description: Convites nominais e códigos de convite de liga.
  - name: PlaySessions
    description: Jogatinas (o dia de jogo) e pódio diário.
  - name: Matches
    description: Partidas, eventos de bola, finalização, cancelamento e correção.
  - name: Rankings
    description: Consulta de reprocessamento de ranking.
  - name: Venues
    description: Catálogo de locais e busca por proximidade.
  - name: Notifications
    description: Caixa de entrada in-app, preferências e devices de push.
  - name: Sharing
    description: Resumo da jogatina, card compartilhável e link público.
externalDocs:
  description: Especificação técnica completa (capítulos 1–21)
  url: https://encacapei.com.br/docs/backend-spec
paths:
  /app/bootstrap:
    get:
      operationId: getAppBootstrap
      summary: Configuração remota do aplicativo
      description: |
        Chamado na splash. Devolve versão mínima suportada, modo de manutenção,
        versões de termos e as **feature flags** que materializam as decisões
        pendentes — o app esconde o chip "Duplas" enquanto `teamMatches = false`,
        em vez de mostrar uma opção que o backend rejeita.
      tags:
        - App
      security: []
      parameters:
        - $ref: '#/components/parameters/AppVersion'
      responses:
        '200':
          description: Configuração atual.
          headers:
            Cache-Control:
              schema:
                type: string
              example: public, max-age=300
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppBootstrap'
              example:
                minSupportedVersion:
                  ios: 1.0.0
                  android: 1.0.0
                latestVersion:
                  ios: 1.0.0
                  android: 1.0.0
                forceUpdate: false
                maintenanceMode: false
                maintenanceEndsAt: null
                termsVersion: '2026-06-01'
                privacyPolicyVersion: '2026-06-01'
                urls:
                  terms: https://encacapei.com.br/termos
                  privacy: https://encacapei.com.br/privacidade
                  support: https://encacapei.com.br/suporte
                features:
                  teamMatches: false
                  pushNotifications: false
                  shareImageGeneration: false
                  venueReviews: false
                  publicLeagueJoin: true
                serverTime: '2026-07-14T22:58:00Z'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /health/live:
    get:
      operationId: getHealthLive
      summary: Liveness probe
      description: Verifica apenas se o processo está no ar. Não toca em dependências.
      tags:
        - App
      security: []
      responses:
        '200':
          description: Processo saudável.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: Healthy
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /health/ready:
    get:
      operationId: getHealthReady
      summary: Readiness probe
      description: Verifica banco de dados e cache. Usado pelo load balancer.
      tags:
        - App
      security: []
      responses:
        '200':
          description: Pronto para receber tráfego.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: Healthy
                checks:
                  - name: postgresql
                    status: Healthy
                    durationMs: 3.1
                  - name: redis
                    status: Healthy
                    durationMs: 0.8
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/register:
    post:
      operationId: register
      summary: Cadastrar usuário (conclusão do wizard de 6 etapas)
      description: |
        Cria a conta, emite tokens e dispara o e-mail de verificação. As 6 etapas são
        de UI; o servidor recebe o payload completo numa **única transação** — não
        existe usuário parcialmente criado (RN-AUTH-006).

        **Anti-enumeração (DP-030):** se o e-mail já existir, a resposta é `202` com
        `{"status":"VERIFICATION_SENT"}` e um e-mail informando a tentativa — nunca
        `409 EMAIL_TAKEN`, que revelaria a base.
      tags:
        - Auth
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              complete:
                summary: Cadastro completo
                value:
                  fullName: Rodrigo Baroni
                  username: baroni
                  email: rodrigo.baroni@email.com
                  password: Sinuca@2026
                  acceptedTermsVersion: '2026-06-01'
                  timezone: America/Sao_Paulo
                  locale: pt-BR
                  deviceInfo:
                    deviceId: b1c2d3e4-f5a6-4b7c-8d9e-000000000001
                    deviceName: iPhone 15 de Rodrigo
                    platform: IOS
      responses:
        '201':
          description: Conta criada; tokens emitidos.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Cache-Control:
              schema:
                type: string
              example: no-store
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              example:
                accessToken: eyJhbGciOiJSUzI1NiIsImtpZCI6ImVuYy0yMDI2LTAzIn0.eyJzdWIiOiIxMTExMTExMS0xMTExLTQxMTEtODExMS0xMTExMTExMTExMTEifQ.mS4k
                refreshToken: v1.MWY0YTNiMmMtOGQ5ZS00ZjcwLTgxMmItMDAwMDAwMDAwMDAx.7Rq2xK9mZ0pL
                tokenType: Bearer
                expiresIn: 900
                refreshExpiresIn: 2592000
                user:
                  id: 11111111-1111-4111-8111-111111111111
                  username: baroni
                  displayName: Rodrigo Baroni
                  email: rodrigo.baroni@email.com
                  avatarUrl: null
                  initials: RB
                  avatarColor: '#C1E778'
                  status: PENDING_VERIFICATION
                  emailVerified: false
                  memberSince: '2026-07-27'
                  timezone: America/Sao_Paulo
                  locale: pt-BR
                  profileVisibility: FRIENDS_ONLY
                  searchableByUsername: true
                  createdAt: '2026-07-27T18:30:00Z'
                  updatedAt: '2026-07-27T18:30:00Z'
                  version: 1
        '202':
          description: E-mail já cadastrado — resposta indistinguível de sucesso (anti-enumeração).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: VERIFICATION_SENT
                  message:
                    type: string
              example:
                status: VERIFICATION_SENT
                message: Enviamos um e-mail com as instruções.
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      operationId: login
      summary: Autenticar por e-mail e senha
      description: |
        Resposta única (`401 INVALID_CREDENTIALS`) para e-mail inexistente, senha
        errada **ou** conta bloqueada, com tempo de resposta normalizado
        (RN-AUTH-015). Conta `DEACTIVATED` é **reativada** automaticamente.
      tags:
        - Auth
      security: []
      parameters:
        - $ref: '#/components/parameters/AppVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              login:
                value:
                  email: rodrigo.baroni@email.com
                  password: Sinuca@2026
                  deviceInfo:
                    deviceId: b1c2d3e4-f5a6-4b7c-8d9e-000000000001
                    deviceName: iPhone 15 de Rodrigo
                    platform: IOS
      responses:
        '200':
          description: Autenticado.
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/refresh:
    post:
      operationId: refreshTokens
      summary: Renovar par de tokens
      description: |
        O refresh token é **rotacionado a cada uso**. Reapresentar um token já
        rotacionado indica roubo: **toda a família de sessão é revogada**
        (RN-AUTH-014).

        O cliente deve **serializar** refreshes concorrentes — três chamadas
        simultâneas derrubariam a sessão.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            examples:
              refresh:
                value:
                  refreshToken: v1.MWY0YTNiMmMtOGQ5ZS00ZjcwLTgxMmItMDAwMDAwMDAwMDAx.7Rq2xK9mZ0pL
      responses:
        '200':
          description: Novo par emitido; o token anterior foi revogado.
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
              example:
                accessToken: eyJhbGciOiJSUzI1NiIsImtpZCI6ImVuYy0yMDI2LTAzIn0.eyJzdWIiOiIxMTExMTExMS0xMTExLTQxMTEtODExMS0xMTExMTExMTExMTEiLCJleHAiOjE3ODQxNTE1MDB9.Xa9
                refreshToken: v1.NGE1YjZjN2QtOGU5Zi00MDAxLTgyM2MtMDAwMDAwMDAwMDAy.Kp8mQ2vN4tR
                tokenType: Bearer
                expiresIn: 900
                refreshExpiresIn: 2592000
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/logout:
    post:
      operationId: logout
      summary: Encerrar sessão
      description: |
        Revoga a sessão corrente (ou todas com `allSessions=true`), coloca o `jti`
        do access token na denylist e desregistra o device de push.
      tags:
        - Auth
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
            examples:
              single:
                summary: Sessão atual
                value:
                  refreshToken: v1.NGE1YjZjN2QtOGU5Zi00MDAxLTgyM2MtMDAwMDAwMDAwMDAy.Kp8mQ2vN4tR
                  allSessions: false
              all:
                summary: Todas as sessões
                value:
                  allSessions: true
      responses:
        '204':
          description: Sessão encerrada.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      summary: Solicitar recuperação de senha
      description: |
        Responde **sempre `202`**, com o mesmo tempo de resposta, exista ou não a
        conta (RN-AUTH-010). O token do e-mail vale **30 minutos** e é de uso único.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordForgotRequest'
            examples:
              forgot:
                value:
                  email: rodrigo.baroni@email.com
      responses:
        '202':
          description: Solicitação aceita (resposta idêntica para e-mail existente ou não).
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - message
                properties:
                  status:
                    type: string
                    const: ACCEPTED
                  message:
                    type: string
              example:
                status: ACCEPTED
                message: Se existir uma conta com esse e-mail, enviaremos as instruções em instantes.
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/password/reset:
    post:
      operationId: resetPassword
      summary: Redefinir senha com token
      description: Troca a senha e **revoga todas as sessões** do usuário (RN-AUTH-011).
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            examples:
              reset:
                value:
                  token: rst_9f8e7d6c5b4a43928180000000000001
                  newPassword: NovaSinuca@2026
      responses:
        '200':
          description: Senha alterada; sessões revogadas.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - sessionsRevoked
                properties:
                  status:
                    type: string
                    const: PASSWORD_RESET
                  sessionsRevoked:
                    type: integer
                  message:
                    type: string
              example:
                status: PASSWORD_RESET
                sessionsRevoked: 3
                message: Senha alterada. Faça login novamente.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/password/change:
    post:
      operationId: changePassword
      summary: Alterar senha (autenticado)
      description: |
        Exige a senha atual. Revoga todas as **outras** sessões, mantendo a corrente
        quando `keepCurrentSession = true` (RN-AUTH-012).
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
            examples:
              change:
                value:
                  currentPassword: Sinuca@2026
                  newPassword: OutraSinuca@2027
                  keepCurrentSession: true
      responses:
        '200':
          description: Senha alterada.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - sessionsRevoked
                  - changedAt
                properties:
                  status:
                    type: string
                    const: PASSWORD_CHANGED
                  sessionsRevoked:
                    type: integer
                  changedAt:
                    type: string
                    format: date-time
              example:
                status: PASSWORD_CHANGED
                sessionsRevoked: 2
                changedAt: '2026-07-27T18:35:41Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/email/verify:
    post:
      operationId: verifyEmail
      summary: Verificar e-mail
      description: Token de uso único com validade de 24 h. Ativa a conta (`status = ACTIVE`).
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
            examples:
              verify:
                value:
                  token: evt_2b3c4d5e6f7048129a34000000000001
      responses:
        '200':
          description: E-mail verificado.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - userId
                  - verifiedAt
                properties:
                  status:
                    type: string
                    const: EMAIL_VERIFIED
                  userId:
                    $ref: '#/components/schemas/Uuid'
                  verifiedAt:
                    type: string
                    format: date-time
              example:
                status: EMAIL_VERIFIED
                userId: 11111111-1111-4111-8111-111111111111
                verifiedAt: '2026-07-27T18:41:03Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
  /auth/email/verify/resend:
    post:
      operationId: resendEmailVerification
      summary: Reenviar e-mail de verificação
      description: Limitado a 1 por minuto e 5 por dia.
      tags:
        - Auth
      responses:
        '202':
          description: Reenvio agendado.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    const: ACCEPTED
                  nextResendAvailableAt:
                    type: string
                    format: date-time
              example:
                status: ACCEPTED
                nextResendAvailableAt: '2026-07-27T18:42:03Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /users/username-available:
    get:
      operationId: checkUsernameAvailability
      summary: Verificar disponibilidade de username
      description: |
        Usado na etapa 2 do cadastro e na edição de perfil. Revela existência de
        **username** (público por design na UI), nunca de e-mail. Rate limit de 20/min.
      tags:
        - Users
      security: []
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 20
            pattern: ^[a-z0-9_.]+$
          example: baroni
      responses:
        '200':
          description: Resultado da verificação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsernameAvailability'
              examples:
                taken:
                  value:
                    username: baroni
                    available: false
                    reason: TAKEN
                    suggestions:
                      - baroni1
                      - baroni_sinuca
                      - rbaroni
                available:
                  value:
                    username: baroni_sinuca
                    available: true
                    reason: null
                    suggestions: []
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /users:
    get:
      operationId: searchUsers
      summary: Buscar usuários
      description: |
        Busca por `username` e `displayName` (trigram, acentos normalizados).
        **Nunca** retorna e-mail nem permite busca por e-mail (RN-PRIV-007).
        Respeita `searchableByUsername`.

        `relationship.status` decide o botão do card: `Adicionar` / `Pendente` /
        `Aceitar` / `Amigos`.
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: excludeFriends
          in: query
          schema:
            type: boolean
            default: false
        - name: leagueId
          in: query
          description: Restringe a membros da liga (usado na seleção de adversário).
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Resultados da busca.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - meta
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserSearchResult'
                  meta:
                    $ref: '#/components/schemas/PaginationMetaCursor'
              example:
                items:
                  - id: 66666666-6666-4666-8666-666666666666
                    username: carlosmota
                    displayName: Carlos Mota
                    avatarUrl: null
                    initials: CA
                    avatarColor: '#c8b6ff'
                    relationship:
                      status: REQUEST_RECEIVED
                      friendRequestId: 9f8e7d6c-5b4a-4392-8180-000000000001
                      canSendRequest: false
                    mutualLeaguesCount: 0
                    mutualFriendsCount: 2
                meta:
                  totalItems: 1
                  pageSize: 20
                  hasMore: false
                  nextCursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /users/{userId}:
    get:
      operationId: getUser
      summary: Consultar perfil público de outro usuário
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: Perfil público.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUser'
              example:
                id: 22222222-2222-4222-8222-222222222222
                username: joaop
                displayName: João Pereira
                avatarUrl: https://cdn.encacapei.com.br/avatars/22222222-2222-4222-8222-222222222222/256.webp
                initials: JO
                avatarColor: '#8ecae6'
