          $ref: '#/components/schemas/Period'
        leagueId:
          type:
            - string
            - 'null'
          format: uuid
        matchesPlayed:
          type: integer
          description: KPI "Partidas jogadas".
          example: 47
        wins:
          type: integer
          example: 29
        losses:
          type: integer
          example: 18
        winRate:
          allOf:
            - $ref: '#/components/schemas/WinRate'
          description: KPI "Taxa de vitória" — `61.70` é exibido como `62%`.
          example: 61.7
        currentWinStreak:
          type: integer
          description: KPI "Vitórias consecutivas".
          example: 5
        longestWinStreak:
          type: integer
          example: 7
        currentLossStreak:
          type: integer
          example: 0
        longestLossStreak:
          type: integer
          description: KPI "Maiores derrotas" (DP-016b).
          example: 2
        sessionsPlayed:
          type: integer
          example: 14
        podiumFirsts:
          type: integer
          example: 6
        podiums:
          type: object
          properties:
            first:
              type: integer
            second:
              type: integer
            third:
              type: integer
        ballsPocketedTotal:
          type: integer
          example: 213
        averageMatchDurationSeconds:
          type:
            - integer
            - 'null'
          example: 1284
        firstMatchAt:
          type:
            - string
            - 'null'
          format: date-time
        lastMatchAt:
          type:
            - string
            - 'null'
          format: date-time
          example: '2026-07-15T01:08:22Z'
        computedAt:
          type: string
          format: date-time
