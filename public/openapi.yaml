  /leagues/{leagueId}/invitations:
    post:
      operationId: inviteToLeague
      summary: Convidar usuários para a liga
      description: |
        Convite em lote. Retorna **`207 Multi-Status`** com resultado por destinatário —
        convite em lote precisa reportar sucesso parcial. Quando há **um único**
        destinatário e ele é convidado com sucesso, responde `201` com o convite, para
        o app não precisar tratar `207` no caso simples.

        Convites expiram em **7 dias**; reenviar renova o `expiresAt` do existente
        (operação idempotente — RN-INVITE-003).
      tags:
        - Invitations
      parameters:
        - $ref: '#/components/parameters/LeagueIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationsRequest'
            examples:
              batch:
                summary: Lote de convites
                value:
                  userIds:
                    - 22222222-2222-4222-8222-222222222222
                    - 33333333-3333-4333-8333-333333333333
                    - 44444444-4444-4444-8444-444444444444
                  message: Bora jogar terça?
              single:
                summary: Um destinatário
                value:
                  userIds:
                    - 22222222-2222-4222-8222-222222222222
      responses:
        '201':
          description: Convite único criado.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueInvitation'
        '207':
          description: Resultado por destinatário (sucesso parcial).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationBatchResult'
              example:
                results:
                  - userId: 22222222-2222-4222-8222-222222222222
                    status: INVITED
                    invitationId: 8a9b0c1d-2e3f-4a5b-8c6d-000000000010
                    expiresAt: '2026-08-03T19:35:00Z'
                  - userId: 33333333-3333-4333-8333-333333333333
                    status: ALREADY_MEMBER
                    invitationId: null
                  - userId: 44444444-4444-4444-8444-444444444444
                    status: ALREADY_INVITED
                    invitationId: 8a9b0c1d-2e3f-4a5b-8c6d-000000000004
                    expiresAt: '2026-08-03T19:35:00Z'
                    renewed: true
                summary:
                  invited: 1
                  alreadyMember: 1
                  alreadyInvited: 1
                  failed: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
